        "401": { description: Authentication required }
  /venom/build-runs/{buildRunId}/provision:
    post:
      operationId: provisionBuildRun
      tags: [venom]
      summary: Provision an approved immutable revision into a candidate
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionBuildRunInput" }
      responses:
        "201":
          description: Provisioning run created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid provisioning request }
        "401": { description: Authentication required }
        "404": { description: Generation run not found }
        "409": { description: Idempotency key already in use }
  /venom/provisioning/runs:
    get:
      operationId: listProvisioningRuns
      tags: [venom]
      summary: List provisioning runs for the current user
      parameters:
        - name: buildRunId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: appId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Provisioning runs
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: "#/components/schemas/ProvisioningRunSummary" }
        "400": { description: Invalid query }
        "401": { description: Authentication required }
  /venom/provisioning/runs/{provisioningRunId}:
    get:
      operationId: getProvisioningRun
      tags: [venom]
      summary: Get one provisioning run with events and releases
      parameters:
        - $ref: "#/components/parameters/ProvisioningRunId"
      responses:
        "200":
          description: Provisioning run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "404": { description: Provisioning run not found }
  /venom/provisioning/runs/{provisioningRunId}/cancel:
    post:
      operationId: cancelProvisioningRun
      tags: [venom]
      summary: Cancel an in-flight provisioning run
      parameters:
        - $ref: "#/components/parameters/ProvisioningRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelProvisioningRunInput" }
      responses:
        "200":
          description: Provisioning run cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid cancellation request }
        "401": { description: Authentication required }
        "404": { description: Provisioning run not found }
        "409": { description: Run cannot be cancelled from its current state }
  /venom/provisioning/runs/{provisioningRunId}/retry:
    post:
      operationId: retryProvisioningRun
      tags: [venom]
      summary: Retry a failed provisioning run
      parameters:
        - $ref: "#/components/parameters/ProvisioningRunId"
      responses:
        "200":
          description: Provisioning run re-queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid retry request }
        "401": { description: Authentication required }
        "404": { description: Provisioning run not found }
        "409": { description: Run is not retryable }
  /venom/provisioning/runs/{provisioningRunId}/publish:
    post:
      operationId: publishProvisioningCandidate
      tags: [venom]
      summary: Publish a healthy candidate release as the primary deployment
      parameters:
        - $ref: "#/components/parameters/ProvisioningRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishProvisioningCandidateInput" }
      responses:
        "200":
          description: Publish result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid publish request }
        "401": { description: Authentication required }
        "404": { description: Provisioning run not found }
        "409": { description: Publish conflict }
  /venom/provisioning/releases/{releaseId}/rollback:
    post:
      operationId: rollbackProvisioningRelease
      tags: [venom]
      summary: Roll back to a previous healthy release
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackProvisioningReleaseInput" }
      responses:
        "200":
          description: Rollback result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningCandidateRelease" }
        "400": { description: Invalid rollback request }
        "401": { description: Authentication required }
        "404": { description: Release not found }
        "409": { description: Rollback conflict }
        "500": { description: Rollback failed }
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    ImportJobId:
      name: importJobId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    SopId:
      name: sopId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    SharedWorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    CommunityThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    CommunityReplyId:
      name: replyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    CommunityNotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    BuildRunId:
      name: buildRunId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BuildExportFormat:
      name: format
      in: path
      required: true
      schema:
        type: string
        enum: [json, markdown]
    ProvisioningRunId:
      name: provisioningRunId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
  schemas:
    VenomAppStatus:
      type: string
      enum: [draft, importing, ready, attention]
    VenomImportStatus:
      type: string
      enum:
        [awaiting_upload, uploading, validating, inspecting, complete, failed]
    VenomApp:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/VenomAppStatus"
        detectedStack:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 60
        sourceType:
          type: string
          enum: [none, zip]
        sourceVersion:
          type: number
          multipleOf: 1
          minimum: 0
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
        importStatus:
          oneOf:
            - $ref: "#/components/schemas/VenomImportStatus"
            - type: "null"
        sourceUpdatedAt:
          type: [string, "null"]
          format: date-time
        linkedProjectId:
          type: [string, "null"]
          maxLength: 120
        linkedProjectName:
          type: [string, "null"]
          maxLength: 120
        latestIterationNumber:
          type: number
          multipleOf: 1
          minimum: 0
        improvementSignal:
          oneOf:
            - $ref: "#/components/schemas/VenomAppImprovementSignal"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, name, purpose, brand, status, detectedStack, sourceType, sourceVersion, deploymentUrl, importStatus, sourceUpdatedAt, linkedProjectId, linkedProjectName, latestIterationNumber, improvementSignal, createdAt, updatedAt]
    VenomAppInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
      required: [name, purpose, brand]
    VenomAppUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/VenomAppStatus"
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
        linkedProjectId:
          type: [string, "null"]
          maxLength: 120
    VenomSourceManifest:
      type: object
      additionalProperties: false
      properties:
        formatVersion:
          type: number
          const: 1
        rootKind:
          type: string
          enum: [single-project, monorepo]
        totalEntries:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 5000
        safeFileCount:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 5000
        excludedSensitiveFileCount:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 5000
        files:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 240
        projectFiles:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 240
        detectedStack:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 60
      required:
        [formatVersion, rootKind, totalEntries, safeFileCount, excludedSensitiveFileCount, files, projectFiles, detectedStack]
    VenomSourceVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        versionNumber:
          type: number
          multipleOf: 1
          minimum: 1
        sourceType:
          type: string
          enum: [zip]
        archiveFilename:
          type: string
          minLength: 1
          maxLength: 160
        archiveBytes:
          type: number
          multipleOf: 1
          minimum: 1
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifest:
          $ref: "#/components/schemas/VenomSourceManifest"
        createdAt:
          type: string
          format: date-time
      required:
        [id, versionNumber, sourceType, archiveFilename, archiveBytes, checksumSha256, manifest, createdAt]
    VenomImportJob:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        appId:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        archiveFilename:
          type: string
          minLength: 1
          maxLength: 160
        declaredBytes:
          type: number
          multipleOf: 1
          minimum: 1
        status:
          $ref: "#/components/schemas/VenomImportStatus"
        progress:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 100
        failureCode:
          type: [string, "null"]
          maxLength: 80
        failureMessage:
          type: [string, "null"]
          maxLength: 240
        sourceVersionId:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F-]{36}$"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
      required:
        [id, appId, archiveFilename, declaredBytes, status, progress, failureCode, failureMessage, sourceVersionId, createdAt, updatedAt, completedAt]
    VenomDeploymentLink:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        label:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          maxLength: 2048
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, label, url, isPrimary, createdAt]
    VenomAppDetail:
      type: object
      additionalProperties: false
      properties:
        app:
          $ref: "#/components/schemas/VenomApp"
        versions:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/VenomSourceVersion"
        importJobs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VenomImportJob"
        deploymentLinks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/VenomDeploymentLink"
        provisioningReleases:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ProvisioningCandidateRelease"
        iterations:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/VenomAppIteration"
        timeline:
          type: array
          maxItems: 400
          items:
            $ref: "#/components/schemas/VenomAppTimelineEntry"
        timelineTotal:
          type: number
          multipleOf: 1
          minimum: 0
        timelineTruncated:
          type: boolean
      required: [app, versions, importJobs, deploymentLinks, provisioningReleases, iterations, timeline, timelineTotal, timelineTruncated]
    VenomAppTimelinePage:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/VenomAppTimelineEntry"
        nextCursor:
          type: [string, "null"]
          maxLength: 300
        total:
          type: number
          multipleOf: 1
          minimum: 0
      required: [entries, nextCursor, total]
    VenomAppImprovementSignal:
      type: object
      additionalProperties: false
      properties:
        since:
          type: string
          format: date-time
        knowledgeChanges:
          type: number
          multipleOf: 1
          minimum: 0
        sourceChanges:
          type: number
          multipleOf: 1
          minimum: 0
        totalChanges:
          type: number
          multipleOf: 1
          minimum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 1500
        baselineIterationNumber:
          type: number
          multipleOf: 1
          minimum: 1
      required: [since, knowledgeChanges, sourceChanges, totalChanges, summary, baselineIterationNumber]
    VenomAppIteration:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        iterationNumber: { type: number, multipleOf: 1, minimum: 1 }
        buildRunId: { $ref: "#/components/schemas/Uuid" }
        revisionId: { $ref: "#/components/schemas/Uuid" }
        packageTitle: { type: string, minLength: 1, maxLength: 160 }
        packageChecksum: { type: string, pattern: "^[a-f0-9]{64}$" }
        runKind: { $ref: "#/components/schemas/VenomBuildRunKind" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        changesSummary: { type: [string, "null"], maxLength: 2000 }
        baselineIterationNumber:
          oneOf:
            - type: number
              multipleOf: 1
              minimum: 1
            - type: "null"
        createdBy: { type: string, minLength: 1, maxLength: 200 }
        createdAt: { type: string, format: date-time }
      required: [id, iterationNumber, buildRunId, revisionId, packageTitle, packageChecksum, runKind, reason, changesSummary, baselineIterationNumber, createdBy, createdAt]
    VenomAppTimelineEntry:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        kind:
          type: string
          enum: [source_import, package_iteration, release_created, release_published, release_rolled_back]
        occurredAt: { type: string, format: date-time }
        title: { type: string, minLength: 1, maxLength: 240 }
        detail: { type: [string, "null"], maxLength: 2000 }
        actor: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, minLength: 1, maxLength: 60 }
        buildRunId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        releaseId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourceVersionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        iterationNumber:
          oneOf:
            - type: number
              multipleOf: 1
              minimum: 1
            - type: "null"
      required: [id, kind, occurredAt, title, detail, actor, status, buildRunId, releaseId, sourceVersionId, iterationNumber]
    VenomAppIterationBaseline:
      type: object
      additionalProperties: false
      properties:
        iterationId: { $ref: "#/components/schemas/Uuid" }
        iterationNumber: { type: number, multipleOf: 1, minimum: 1 }
        buildRunId: { $ref: "#/components/schemas/Uuid" }
        revisionId: { $ref: "#/components/schemas/Uuid" }
        packageTitle: { type: string, minLength: 1, maxLength: 160 }
        approvedAt: { type: [string, "null"], format: date-time }
        resolvable: { type: boolean }
      required: [iterationId, iterationNumber, buildRunId, revisionId, packageTitle, approvedAt, resolvable]
    VenomAppIterationChanges:
      type: object
      additionalProperties: false
      properties:
        since: { type: string, format: date-time }
        knowledgeChanges: { type: number, multipleOf: 1, minimum: 0 }
        sourceChanges: { type: number, multipleOf: 1, minimum: 0 }
        summary: { type: string, minLength: 1, maxLength: 1500 }
      required: [since, knowledgeChanges, sourceChanges, summary]
    VenomAppIterationContext:
      type: object
      additionalProperties: false
      properties:
        appId: { $ref: "#/components/schemas/Uuid" }
        appName: { type: string, minLength: 1, maxLength: 120 }
        linkedProject:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                id: { type: string, minLength: 1, maxLength: 120 }
                name: { type: string, minLength: 1, maxLength: 120 }
              required: [id, name]
            - type: "null"
        baseline:
          oneOf:
            - $ref: "#/components/schemas/VenomAppIterationBaseline"
            - type: "null"
        latestSourceVersion:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                versionNumber: { type: number, multipleOf: 1, minimum: 1 }
                archiveFilename: { type: string, minLength: 1, maxLength: 160 }
              required: [id, versionNumber, archiveFilename]
            - type: "null"
        suggestedSops:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              sopId: { $ref: "#/components/schemas/Uuid" }
              revisionId: { $ref: "#/components/schemas/Uuid" }
              revisionNumber: { type: number, multipleOf: 1, minimum: 1 }
              title: { type: string, minLength: 1, maxLength: 160 }
            required: [sopId, revisionId, revisionNumber, title]
        changes:
          oneOf:
            - $ref: "#/components/schemas/VenomAppIterationChanges"
            - type: "null"
        canIterate: { type: boolean }
        blockedReason:
          oneOf:
            - type: string
              enum: [no_baseline, baseline_unresolvable]
            - type: "null"
      required: [appId, appName, linkedProject, baseline, latestSourceVersion, suggestedSops, changes, canIterate, blockedReason]
    VenomAppIterationInput:
      type: object
      additionalProperties: false
      properties:
        instruction: { type: string, minLength: 1, maxLength: 4000 }
        constraints: { type: string, maxLength: 4000 }
        sopRevisionIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
      required: [instruction, idempotencyKey]
    VenomImportInput:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^.*\\.[zZ][iI][pP]$"
        size:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 52428800
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
      required: [filename, size, idempotencyKey]
    VenomImportUploadTicket:
      type: object
      additionalProperties: false
      properties:
        job:
          $ref: "#/components/schemas/VenomImportJob"
        uploadUrl:
          type: string
          maxLength: 8192
        maxBytes:
          type: number
          const: 52428800
        requiredContentType:
          type: string
          const: application/zip
      required: [job, uploadUrl, maxBytes, requiredContentType]
    VenomBuildTargetType:
      type: string
      enum: [app, website, brand, customer_service_flow]
    VenomBuildRunStatus:
      type: string
      enum:
        [queued, preparing, review_required, approved, cancelled, failed, ready_for_provisioning]
    VenomBuildRunKind:
      type: string
      enum: [standard, app_iteration]
    VenomBuildRunInput:
      type: object
      additionalProperties: false
      properties:
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        targetName: { type: string, minLength: 1, maxLength: 120 }
        requirements: { type: string, minLength: 1, maxLength: 8000 }
        constraints: { type: string, maxLength: 4000 }
        brandDirection: { type: string, maxLength: 3000 }
        appId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourceVersionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        projectId: { type: [string, "null"], maxLength: 120 }
        sopRevisionIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
      required:
        [targetType, targetName, requirements, constraints, brandDirection, appId, sourceVersionId, projectId, sopRevisionIds, idempotencyKey]
    VenomBuildRequestSnapshot:
      type: object
      additionalProperties: false
      properties:
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        targetName: { type: string, minLength: 1, maxLength: 120 }
        requirements: { type: string, minLength: 1, maxLength: 8000 }
        constraints: { type: string, maxLength: 4000 }
        brandDirection: { type: string, maxLength: 3000 }
        appId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourceVersionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        projectId: { type: [string, "null"], maxLength: 120 }
        sopRevisionIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
        baselineIterationId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        baselineRevisionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        changesSummary: { type: [string, "null"], maxLength: 2000 }
      required:
        [targetType, targetName, requirements, constraints, brandDirection, appId, sourceVersionId, projectId, sopRevisionIds, baselineIterationId, baselineRevisionId, changesSummary]
    VenomBuildSourceReference:
      type: object
      additionalProperties: false
      properties:
        appId: { $ref: "#/components/schemas/Uuid" }
        appName: { type: string, minLength: 1, maxLength: 120 }
        sourceVersionId: { $ref: "#/components/schemas/Uuid" }
        versionNumber: { type: number, multipleOf: 1, minimum: 1 }
        checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      required: [appId, appName, sourceVersionId, versionNumber, checksumSha256]
    VenomBuildSopReference:
      type: object
      additionalProperties: false
      properties:
        sopId: { $ref: "#/components/schemas/Uuid" }
        revisionId: { $ref: "#/components/schemas/Uuid" }
        revisionNumber: { type: number, multipleOf: 1, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 160 }
        checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      required: [sopId, revisionId, revisionNumber, title, checksumSha256]
    VenomBuildProductBrief:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string, minLength: 1, maxLength: 3000 }
        audience:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 300 }
        outcomes:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
      required: [summary, audience, outcomes]
    VenomBuildPermissionRequest:
      type: object
      additionalProperties: false
      properties:
        capability: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1, maxLength: 600 }
        required: { type: boolean }
      required: [capability, reason, required]
    VenomBuildPackage:
      type: object
      additionalProperties: false
      properties:
        formatVersion: { type: number, const: 1 }
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        title: { type: string, minLength: 1, maxLength: 160 }
        productBrief: { $ref: "#/components/schemas/VenomBuildProductBrief" }
        functionalScope:
          type: array
          maxItems: 40
          items: { type: string, minLength: 1, maxLength: 800 }
        brandDirection:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        contentRequirements:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        serviceFlowRequirements:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        sourceReferences:
          type: array
          maxItems: 1
          items: { $ref: "#/components/schemas/VenomBuildSourceReference" }
        sopReferences:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/VenomBuildSopReference" }
        dataNeeds:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        integrationNeeds:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        permissionRequests:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/VenomBuildPermissionRequest" }
        acceptanceChecks:
          type: array
          minItems: 1
          maxItems: 40
          items: { type: string, minLength: 1, maxLength: 800 }
        launchConstraints:
          type: array
          minItems: 1
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
      required:
        [formatVersion, targetType, title, productBrief, functionalScope, brandDirection, contentRequirements, serviceFlowRequirements, sourceReferences, sopReferences, dataNeeds, integrationNeeds, permissionRequests, acceptanceChecks, launchConstraints]
    VenomBuildPackageRevision:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        revisionNumber: { type: number, multipleOf: 1, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        package: { $ref: "#/components/schemas/VenomBuildPackage" }
        checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
      required:
        [id, revisionNumber, reason, package, checksumSha256, createdAt, approvedAt]
    VenomBuildRunEvent:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        eventType:
          type: string
          enum: [queued, preparing, review_required, revised, approved, ready_for_provisioning, cancelled, rejected, failed, retried]
        status: { $ref: "#/components/schemas/VenomBuildRunStatus" }
        progress: { type: number, multipleOf: 1, minimum: 0, maximum: 100 }
        message: { type: string, minLength: 1, maxLength: 240 }
        createdAt: { type: string, format: date-time }
      required: [id, eventType, status, progress, message, createdAt]
    VenomBuildRunSummary:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        correlationId: { $ref: "#/components/schemas/Uuid" }
        appId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        runKind: { $ref: "#/components/schemas/VenomBuildRunKind" }
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        targetName: { type: string, minLength: 1, maxLength: 120 }
        status: { $ref: "#/components/schemas/VenomBuildRunStatus" }
        progress: { type: number, multipleOf: 1, minimum: 0, maximum: 100 }
        currentRevisionNumber: { type: number, multipleOf: 1, minimum: 0 }
        approvedRevisionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        failureMessage: { type: [string, "null"], maxLength: 240 }
        cancelledReason: { type: [string, "null"], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [id, correlationId, appId, runKind, targetType, targetName, status, progress, currentRevisionNumber, approvedRevisionId, failureMessage, cancelledReason, createdAt, updatedAt]
    VenomBuildRun:
      allOf:
        - $ref: "#/components/schemas/VenomBuildRunSummary"
        - type: object
          additionalProperties: false
          properties:
            request: { $ref: "#/components/schemas/VenomBuildRequestSnapshot" }
            revisions:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/VenomBuildPackageRevision" }
            events:
              type: array
              maxItems: 200
              items: { $ref: "#/components/schemas/VenomBuildRunEvent" }
            attempt: { type: number, multipleOf: 1, minimum: 1, maximum: 10 }
            failureCode: { type: [string, "null"], maxLength: 80 }
            startedAt: { type: [string, "null"], format: date-time }
            completedAt: { type: [string, "null"], format: date-time }
          required:
            [request, revisions, events, attempt, failureCode, startedAt, completedAt]
    VenomBuildCancellationInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
      required: [reason]
    VenomBuildRejectionInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
      required: [reason]
    VenomBuildRevisionInput:
      type: object
      additionalProperties: false
      properties:
        instruction: { type: string, minLength: 1, maxLength: 3000 }
      required: [instruction]
    VenomBuildApprovalInput:
      type: object
      additionalProperties: false
      properties:
        revisionId: { $ref: "#/components/schemas/Uuid" }
      required: [revisionId]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VenomChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content
    VenomChatRequest:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/VenomChatMessage"
        projectContext:
          type: string
          maxLength: 8000
        projectId:
          type: string
          minLength: 1
          maxLength: 160
        workspaceId:
          $ref: "#/components/schemas/Uuid"
        modelId:
          $ref: "#/components/schemas/VenomModelId"
        sourceCitationIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,160}$"
        sourceSnapshots:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/AttestedSourceSnapshot"
        deliberate:
          type: boolean
          description: Opt this message into multi-voice deliberation.
        mode:
          $ref: "#/components/schemas/VenomResponseMode"
        blend:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/VenomBlendWeight"
          description: >-
            Favoring weights for the participating voices in verify and debate.
            Omitted means an even blend. Weights favor a voice; they never
            silence the others.
      required:
        - messages
        - projectId
    VenomResponseMode:
      type: string
      enum: [talk, verify, debate]
      description: >-
        How Venom answers — a single assistant (talk), background multi-voice
        verification that converges on one conclusion (verify), or a visible
        multi-voice debate in the thread (debate).
    VenomBlendWeight:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Corner identity — a managed model id when real providers back the
            corner, a persona voice id otherwise.
        weight:
          type: number
          minimum: 0
          maximum: 1
      required: [id, weight]
    VenomModelId:
      type: string
      enum: [venom-gpt, venom-claude, venom-gemini, venom-grok]
    VenomVoiceId:
      type: string
      enum: [direct, skeptic, evidence]
    VenomDeliberationVoice:
      type: object
      additionalProperties: false
      properties:
        voiceId:
          $ref: "#/components/schemas/VenomVoiceId"
        name:
          type: string
          minLength: 1
          maxLength: 80
        tagline:
          type: string
          minLength: 1
          maxLength: 240
      required: [voiceId, name, tagline]
    VenomDeliberationAvailability:
      type: object
      additionalProperties: false
      properties:
        available:
          type: boolean
        distinctModels:
          type: boolean
          description: Whether voices can run on genuinely different models.
        voices:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/VenomDeliberationVoice"
      required: [available, distinctModels, voices]
    VenomManagedModel:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/VenomModelId"
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        name:
          type: string
          minLength: 1
          maxLength: 80
        family:
          type: string
          enum: [GPT, Claude, Gemini, Grok]
        summary:
          type: string
          minLength: 1
          maxLength: 240
        available:
          type: boolean
        availabilityText:
          type: string
          minLength: 1
          maxLength: 160
      required:
        [id, provider, name, family, summary, available, availabilityText]
    VenomModelPreferences:
      type: object
      additionalProperties: false
      properties:
        enabledModelIds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/VenomModelId"
        defaultModelId:
          $ref: "#/components/schemas/VenomModelId"
        activeModelId:
          $ref: "#/components/schemas/VenomModelId"
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
      required: [enabledModelIds, defaultModelId, activeModelId, updatedAt]
    VenomVoicePresetId:
      type: string
      enum: [sam, marcus, rowan, elijah, maya, isla]
    VenomVoicePreset:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/VenomVoicePresetId"
        name:
          type: string
          minLength: 1
          maxLength: 40
        persona:
          type: string
          minLength: 1
          maxLength: 160
        tone:
          type: string
          enum: [masculine, feminine, neutral]
        sampleText:
          type: string
          minLength: 1
          maxLength: 240
        available:
          type: boolean
        availabilityText:
          type: string
          minLength: 1
          maxLength: 160
      required: [id, name, persona, tone, sampleText, available, availabilityText]
    VenomVoicePreferences:
      type: object
      additionalProperties: false
      properties:
        presetId:
          $ref: "#/components/schemas/VenomVoicePresetId"
        talkativeness:
          $ref: "#/components/schemas/VenomVoiceTalkativeness"
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
      required: [presetId, updatedAt]
    VenomVoiceTalkativeness:
      type: string
      description: >-
        How eager voice mode is to answer remarks that don't clearly invite a
        reply. Optional on stored preferences; absent means "balanced".
      enum: [chatty, balanced, reserved]
    VenomVoiceTranscriptionRequest:
      type: object
      additionalProperties: false
      properties:
        audioBase64:
          type: string
          minLength: 1
          maxLength: 5000000
        format:
          type: string
          enum: [webm, wav, mp3, mp4, ogg]
      required: [audioBase64]
    VenomVoiceTranscription:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 8000
      required: [text]
    VenomVoiceSpeechRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        presetId:
          $ref: "#/components/schemas/VenomVoicePresetId"
      required: [text, presetId]
    VenomVoiceTurnDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 8000
        recentTurns:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                maxLength: 4000
            required: [role, content]
        talkativeness:
          $ref: "#/components/schemas/VenomVoiceTalkativeness"
      required: [transcript]
    VenomVoiceTurnDecision:
      type: object
      additionalProperties: false
      properties:
        decisionId:
          type: string
          minLength: 1
          maxLength: 80
          description: Present only once the decision row is durably recorded; when absent, the client executes the decision without reporting an outcome.
        decision:
          type: string
          enum: [respond, acknowledge, silent]
        windDown:
          type: boolean
          description: The exchange reads as a goodbye; the session may ease itself closed after a quiet period.
        acknowledgment:
          type: string
          maxLength: 200
          description: Short spoken acknowledgment; present only when decision is "acknowledge".
      required: [decision, windDown]
    VenomVoiceDecisionOutcomeRequest:
      type: object
      additionalProperties: false
      properties:
        decisionId:
          type: string
          minLength: 1
          maxLength: 80
        outcome:
          type: string
          enum:
            - reply_completed
            - reply_interrupted
            - user_followed_up
            - stayed_quiet
            - wound_down
            - session_closed
      required: [decisionId, outcome]
    VenomVoiceDecisionOutcomeResult:
      type: object
      additionalProperties: false
      properties:
        recorded:
          type: boolean
      required: [recorded]
    KnowledgeConversation:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        title:
          type: string
          minLength: 1
          maxLength: 160
        projectId:
          type: [string, "null"]
          maxLength: 160
    KnowledgeMessage:
      type: object
      additionalProperties: false
      required: [id, role, content]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 8000
    KnowledgeExtractionInput:
      type: object
      additionalProperties: false
      required: [conversation, messages]
      properties:
        conversation:
          $ref: "#/components/schemas/KnowledgeConversation"
        messages:
          type: array
          minItems: 1
          maxItems: 48
          items:
            $ref: "#/components/schemas/KnowledgeMessage"
        file:
          type: boolean
          description: >-
            When true, the server files the extracted insights into the
            signed-in user's ontology store and returns the touched concepts
            in `filed`. Clients that omit this keep filing locally.
        workspaceId:
          $ref: "#/components/schemas/Uuid"
    KnowledgeCandidate:
      type: object
      additionalProperties: false
      required:
        [label, category, confidence, summary, sourceMessageIds, relatedLabels]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
        category:
          type: string
          minLength: 1
          maxLength: 32
        confidence:
          type: number
          minimum: 0
          maximum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 240
        sourceMessageIds:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 160
        relatedLabels:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 64
    KnowledgeExtraction:
      type: object
      additionalProperties: false
      required: [clusters]
      properties:
        clusters:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/KnowledgeCandidate"
        filed:
          type: array
          maxItems: 80
          description: >-
            Present only when the request set `file: true` and the insights
            were filed server-side. Contains every concept the filing
            created, strengthened, or re-linked, with canonical ids.
          items:
            $ref: "#/components/schemas/VenomKnowledgeCluster"
        filedWorkspaceId:
          $ref: "#/components/schemas/Uuid"
    VenomOntologySearchResult:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          label,
          category,
          summary,
          strength,
          mentionCount,
          lastUpdatedAt,
          evidenceCount,
        ]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        projectId:
          type: string
          maxLength: 120
          nullable: true
        label:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        summary:
          type: string
          maxLength: 2000
        strength:
          type: number
          minimum: 0
          maximum: 1
        mentionCount:
          type: number
          minimum: 0
        lastUpdatedAt:
          type: number
          minimum: 0
        evidenceCount:
          type: number
          minimum: 0
    VenomOntologySearchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/VenomOntologySearchResult"
    VenomOntologyConceptDetail:
      type: object
      additionalProperties: false
      required: [concept, neighbors, people]
      properties:
        concept:
          $ref: "#/components/schemas/VenomKnowledgeCluster"
        neighbors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VenomOntologySearchResult"
        people:
          description: >-
            Identity labels for every person attributed to this concept's
            evidence. Evidence captured before attribution is reported under
            the ontology owner's identity, so every evidence entry's
            capturedByUserId resolves against this list.
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/VenomOntologyPerson"
    VenomOntologyPerson:
      type: object
      additionalProperties: false
      required: [userId, displayName]
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 120
        displayName:
          description: >-
            Best display label for the person (their name, else their
            email). Null when the identity record has neither.
          type: [string, "null"]
          maxLength: 320
    VenomIdentity:
      type: object
      additionalProperties: false
      required: [userId, displayName, email, provider]
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 120
        displayName:
          type: [string, "null"]
          maxLength: 200
        email:
          type: [string, "null"]
          maxLength: 320
        provider:
          description: >-
            Sign-in provider slug for the account, for example "google" or
            "password". Null when the provider is unknown.
          type: [string, "null"]
          maxLength: 60
    VenomNoteInput:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 5000
    VenomNoteImprovement:
      type: object
      additionalProperties: false
      required: [suggestion, changeNotes]
      properties:
        suggestion:
          type: string
          minLength: 1
          maxLength: 5000
        changeNotes:
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 160
    GitHubRepository:
      type: object
      required: [fullName, name, url, updatedAt]
      properties:
        fullName:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        url:
          type: string
        updatedAt:
          type: string
          format: date-time
    GitHubSourceInput:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          minLength: 3
          maxLength: 200
    WebsiteSourceInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
        name:
          type: string
          minLength: 1
          maxLength: 120
    SourceCitation:
      type: object
      additionalProperties: false
      required: [id, provider, kind, title, url, excerpt, reference]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Za-z0-9_-]{1,160}$"
        provider:
          type: string
          enum: [github, website]
        kind:
          type: string
          enum: [repository, issue, pull_request, website]
        title:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          maxLength: 2048
        excerpt:
          type: string
          minLength: 1
          maxLength: 1000
        reference:
          type: ["string", "null"]
          minLength: 1
          maxLength: 200
    SourceCluster:
      type: object
      required: [id, label, category, strength, citationIds]
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
        strength:
          type: number
          minimum: 0
          maximum: 1
        citationIds:
          type: array
          items:
            type: string
    AttestedSourceSnapshot:
      type: object
      additionalProperties: false
      required: [id, context, citations, attestation]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Za-z0-9_-]{1,160}$"
        context:
          type: string
          minLength: 1
          maxLength: 8000
        citations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/SourceCitation"
        attestation:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: "^v1\\.[A-Za-z0-9_-]{2,214}\\.[a-f0-9]{64}\\.[A-Za-z0-9_-]{43}$"
    ProjectSourceSchedule:
      type: object
      additionalProperties: false
      required: [cadence, updatedAt]
      description: >-
        Unattended update schedule for a connected source. "off" is recorded
        explicitly rather than by dropping the schedule so that turning a
        schedule off survives a merge with a device that still has it on.
      properties:
        cadence:
          type: string
          enum: [off, daily, weekly]
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
          description: >-
            Epoch milliseconds of the last cadence change. Schedules merge on
            this timestamp, independently of the source snapshot itself.
        lastAttemptAt:
          type: number
          multipleOf: 1
          minimum: 0
          description: Epoch milliseconds of the last scheduled sync attempt, successful or not.
        lastError:
          type: string
          maxLength: 300
          description: Why the last scheduled sync failed. Absent once a sync succeeds.
        claimedAt:
          type: number
          multipleOf: 1
          minimum: 0
          description: >-
            Epoch milliseconds when a device claimed the next scheduled sync of
            this source. A live claim pauses the schedule on other devices so a
            due source is re-synced once per cadence for the account, not once
            per open device. Completed attempts and expired leases clear it.
        claimedBy:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Opaque per-device-session token that wrote claimedAt, so the
            claiming device can recognize its own claim after a merge.
    ProjectSource:
      type: object
      required:
        [id, projectId, provider, name, url, status, syncedAt, summary, context, citations, clusters]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        projectId:
          type: string
          minLength: 1
          maxLength: 160
