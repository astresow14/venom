  /venom/apps/{appId}/ai/credential/rotate:
    post:
      operationId: rotateVenomAppAiCredential
      tags: [venom]
      summary: Rotate the app's AI gateway credential
      description: >-
        Revokes the current credential and mints a replacement in one step.
        The new secret is delivered into the provisioned app's secret storage
        through the provisioning provider — it never appears in this API. If
        immediate delivery is not possible, the credential is delivered at
        the next provisioning handoff and the overview reports it as not yet
        delivered.
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: AI overview reflecting the fresh credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomAppAiOverview"
        "401":
          description: Authentication required
        "404":
          description: App not found
  /venom/apps/{appId}/ai/credential/revoke:
    post:
      operationId: revokeVenomAppAiCredential
      tags: [venom]
      summary: Revoke the app's AI gateway credential
      description: >-
        Server-side kill switch: the deployed app's AI stops immediately and
        stays off until a rotate or the next provisioning handoff mints a
        replacement.
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: AI overview with no active credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomAppAiOverview"
        "401":
          description: Authentication required
        "404":
          description: App not found
