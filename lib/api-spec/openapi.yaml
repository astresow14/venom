      responses:
        "200":
          description: Updated SOP assignments
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/VenomSopAppAssignment" }
        "400": { description: Invalid app assignments }
        "401": { description: Authentication required }
        "404": { description: SOP or app not found }
  /venom/sops/{sopId}/revisions:
    get:
      operationId: listVenomSopRevisions
      tags: [venom]
      summary: List immutable SOP revisions
      parameters:
        - $ref: "#/components/parameters/SopId"
      responses:
        "200":
          description: SOP revision history
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: "#/components/schemas/VenomSopRevision" }
        "401": { description: Authentication required }
        "404": { description: SOP not found }
  /venom/projects/{projectId}/sops:
    get:
      operationId: listVenomProjectSops
      tags: [venom]
      summary: List active SOP revision references selected for a workspace project
      parameters:
