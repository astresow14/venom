        "400": { description: SOP draft cannot be published }
        "401": { description: Authentication required }
        "404": { description: SOP not found }
  /venom/sops/{sopId}/duplicate:
    post:
      operationId: duplicateVenomSop
      tags: [venom]
      summary: Duplicate an SOP into a new mutable draft
      parameters:
        - $ref: "#/components/parameters/SopId"
      responses:
        "201":
          description: Duplicate SOP draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomSop" }
        "401": { description: Authentication required }
        "404": { description: SOP not found }
  /venom/sops/{sopId}/archive:
    post:
      operationId: archiveVenomSop
      tags: [venom]
      summary: Archive an SOP without deleting its revision history
      parameters:
        - $ref: "#/components/parameters/SopId"
      responses:
        "200":
          description: Archived SOP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomSop" }
        "401": { description: Authentication required }
        "404": { description: SOP not found }
  /venom/sops/{sopId}/apps:
    put:
      operationId: assignVenomSopApps
