        "404": { description: SOP not found }
    patch:
      operationId: updateVenomSop
      tags: [venom]
      summary: Update a mutable SOP draft
      parameters:
        - $ref: "#/components/parameters/SopId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomSopUpdate" }
      responses:
        "200":
          description: Updated SOP draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomSop" }
        "400": { description: Invalid or unsafe SOP reference material }
        "401": { description: Authentication required }
        "404": { description: SOP not found }
  /venom/sops/{sopId}/publish:
    post:
      operationId: publishVenomSop
      tags: [venom]
      summary: Publish the current draft as an immutable SOP revision
      parameters:
