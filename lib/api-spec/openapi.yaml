        "409":
          description: The last admin cannot be removed; delete the company instead
  /venom/orgs/{orgId}/invites:
    post:
      operationId: inviteVenomOrgMember
      tags: [venom]
      summary: Invite a teammate by email (admins only)
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteVenomOrgMemberInput"
      responses:
        "200":
          description: The teammate was added directly or an invite is now pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteVenomOrgMemberResult"
        "400":
          description: Invalid email address
        "401":
          description: Authentication required
        "403":
          description: Only company admins can invite members
        "404":
          description: Company not found
        "409":
          description: Already a member or already invited
  /venom/orgs/{orgId}/invites/{inviteId}:
    delete:
      operationId: revokeVenomOrgInvite
      tags: [venom]
      summary: Revoke a pending invite (admins only)
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
        - $ref: "#/components/parameters/VenomOrgInviteId"
      responses:
        "204":
          description: Invite revoked
        "401":
          description: Authentication required
        "403":
          description: Only company admins can revoke invites
        "404":
          description: Invite not found
  /venom/org-invites/{inviteId}/accept:
    post:
      operationId: acceptVenomOrgInvite
      tags: [venom]
      summary: Accept a company invite addressed to one of my verified emails
      parameters:
        - $ref: "#/components/parameters/VenomOrgInviteId"
      responses:
        "200":
          description: Joined; the company as seen by the new member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOrg"
        "401":
          description: Authentication required
        "403":
          description: Invite is addressed to a different email
        "404":
          description: Invite not found
  /venom/org-invites/{inviteId}/decline:
    post:
      operationId: declineVenomOrgInvite
      tags: [venom]
      summary: Decline a company invite addressed to one of my verified emails
      parameters:
        - $ref: "#/components/parameters/VenomOrgInviteId"
      responses:
        "204":
          description: Invite declined
        "401":
          description: Authentication required
        "403":
          description: Invite is addressed to a different email
        "404":
          description: Invite not found
  /venom/master/contribution:
    get:
      operationId: getVenomMasterContribution
      tags: [venom]
      summary: Read the signed-in user's knowledge-network contribution setting
      responses:
        "200":
          description: Whether this account shares anonymous concept signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomMasterContribution"
        "401":
          description: Authentication required
    put:
      operationId: updateVenomMasterContribution
      tags: [venom]
      summary: Turn anonymous knowledge-network contribution on or off
      description: >-
        Off by default. Turning it off is retroactive: the account's past
        concept signals are removed from all future aggregates before the
        response returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenomMasterContributionInput"
      responses:
        "200":
          description: The saved setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomMasterContribution"
        "400":
          description: Invalid body
        "401":
          description: Authentication required
  /venom/orgs/{orgId}/contribution:
    get:
      operationId: getVenomOrgMasterContribution
      tags: [venom]
      summary: Read a company's knowledge-network contribution setting
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      responses:
        "200":
          description: Whether this company shares anonymous concept signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomMasterContribution"
        "401":
          description: Authentication required
        "403":
          description: Caller is not a member of this company
        "404":
          description: Company not found
    put:
      operationId: updateVenomOrgMasterContribution
      tags: [venom]
      summary: Company admins turn anonymous contribution on or off
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenomMasterContributionInput"
      responses:
        "200":
          description: The saved setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomMasterContribution"
        "400":
          description: Invalid body
        "401":
          description: Authentication required
        "403":
          description: Only company admins can change this setting
        "404":
          description: Company not found
  /venom/master/brain:
    get:
      operationId: getVenomMasterBrain
      tags: [venom]
      summary: Explore the anonymous Venom master knowledge map
      description: >-
        Aggregate concepts and connection patterns learned across opted-in
        accounts and companies. Contains labels, categories, and normalized
        weights only — never names, excerpts, or tenant traces — and a
        concept appears only once seen across the minimum number of
        distinct contributors.
      responses:
        "200":
          description: The master map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomMasterBrain"
        "401":
          description: Authentication required
  /venom/master/suggestions:
    get:
      operationId: getVenomMasterSuggestions
      tags: [venom]
      summary: Concepts commonly related to this Brain across the Venom network
      parameters:
        - name: org
          in: query
          required: false
          description: >-
            Company id. When present, suggestions are computed against that
            company's shared Brain; the caller must be a member.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Dismissible suggestions drawn from the master ontology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomMasterSuggestionList"
        "401":
          description: Authentication required
        "403":
          description: Caller is not a member of this company
        "404":
          description: Company not found
  /venom/master/suggestions/dismiss:
    post:
      operationId: dismissVenomMasterSuggestion
      tags: [venom]
      summary: Hide a Venom network suggestion for this account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissVenomMasterSuggestionInput"
      responses:
        "200":
          description: The suggestion will not be offered to this account again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomMasterSuggestionDismissal"
        "400":
          description: Invalid body
        "401":
          description: Authentication required
  /venom/master/suggestions/apply:
    post:
      operationId: applyVenomMasterSuggestion
      tags: [venom]
      summary: Add a Venom network suggestion to a Brain
      description: >-
        Files the suggested concept into the caller's personal Brain, or —
        when orgId is present and the caller is a member — into that
        company's shared Brain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyVenomMasterSuggestionInput"
      responses:
        "200":
          description: Where the concept was filed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomMasterSuggestionApplied"
        "400":
          description: Invalid body
        "401":
          description: Authentication required
        "403":
          description: Caller is not a member of this company
        "404":
          description: Company not found
  /venom/orgs/{orgId}/brain:
    get:
      operationId: getVenomOrgBrain
      tags: [venom]
      summary: Read the company's shared Brain with its contribution audit
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      responses:
        "200":
          description: Shared concepts plus the most recent contributions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOrgBrain"
        "401":
          description: Authentication required
        "403":
          description: Caller is not a member of this company
        "404":
          description: Company not found
  /venom/orgs/{orgId}/projects:
    get:
      operationId: getVenomOrgProjects
      tags: [venom]
      summary: List the company's shared projects
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      responses:
        "200":
          description: Projects members work on together
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOrgProjectList"
        "401":
          description: Authentication required
        "403":
          description: Caller is not a member of this company
        "404":
          description: Company not found
  /venom/orgs/{orgId}/projects/{projectId}:
    put:
      operationId: shareVenomOrgProject
      tags: [venom]
      summary: Mark one of my projects as company-shared (admins only)
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareVenomOrgProjectInput"
      responses:
        "200":
          description: The shared project registry entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOrgSharedProject"
        "400":
          description: Invalid project details
        "401":
          description: Authentication required
        "403":
          description: Only company admins can share projects
        "404":
          description: Company not found
        "409":
          description: Project is already shared with a different company
    delete:
      operationId: unshareVenomOrgProject
      tags: [venom]
      summary: Stop sharing a project with the company
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project is personal again; already-filed knowledge stays in the company Brain
        "401":
          description: Authentication required
        "403":
          description: Only company admins or the sharer can unshare a project
        "404":
          description: Company or shared project not found
  /venom/orgs/{orgId}/sources:
    get:
      operationId: getVenomOrgSources
      tags: [venom]
      summary: List the company's connected knowledge sources
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      responses:
        "200":
          description: Sources feeding the company Brain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOrgSourceList"
        "401":
          description: Authentication required
        "403":
          description: Caller is not a member of this company
        "404":
          description: Company not found
  /venom/orgs/{orgId}/sources/github:
    post:
      operationId: connectVenomOrgGitHubSource
      tags: [venom]
      summary: Connect a GitHub repository as a company knowledge source (admins only)
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubSourceInput"
      responses:
        "200":
          description: Connected company source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOrgSource"
        "400":
          description: Invalid repository identifier
        "401":
          description: Authentication required
        "403":
          description: Only company admins may connect sources, and the workspace GitHub connection must authorize them
        "404":
          description: Company or repository not found
        "502":
          description: GitHub connection unavailable
  /venom/orgs/{orgId}/sources/website:
    post:
      operationId: connectVenomOrgWebsiteSource
      tags: [venom]
      summary: Connect a public website as a company knowledge source (admins only)
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteSourceInput"
      responses:
        "200":
          description: Connected company source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOrgSource"
        "400":
          description: Invalid or unsafe website URL
        "401":
          description: Authentication required
        "403":
          description: Only company admins can connect sources
        "404":
          description: Company not found
        "422":
          description: Website content could not be read
        "502":
          description: Website could not be reached
  /venom/orgs/{orgId}/sources/{sourceId}:
    delete:
      operationId: removeVenomOrgSource
      tags: [venom]
      summary: Disconnect a company knowledge source and retire its concepts
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
        - $ref: "#/components/parameters/VenomOrgSourceId"
      responses:
        "204":
          description: Source removed and its Brain concepts retired
        "401":
          description: Authentication required
        "403":
          description: Only company admins can remove sources
        "404":
          description: Company or source not found
  /venom/orgs/{orgId}/promote:
    post:
      operationId: promoteVenomConceptToOrg
      tags: [venom]
      summary: Promote a personal Brain concept into the company Brain
      description: >-
        The explicit, member-initiated action that lifts one personal concept
        (with its evidence) into the company's shared Brain. Nothing personal
        enters a company Brain without this call or work done inside shared
        projects and company sources.
      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteVenomConceptInput"
      responses:
        "200":
          description: The concept as it now exists in the company Brain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoteVenomConceptResult"
        "400":
          description: Invalid concept payload
        "401":
          description: Authentication required
        "403":
          description: Caller is not a member of this company
        "404":
          description: Company not found
  /venom/notes/improve:
    post:
      operationId: improveVenomNote
      tags: [venom]
      summary: Improve the grammar and organization of a draft project note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomNoteInput"
      responses:
        "200":
          description: An editable suggestion and concise summary of changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomNoteImprovement"
        "401":
          description: Authentication required
        "429":
          description: Too many note improvement requests
  /venom/github/repositories:
    get:
      operationId: getGitHubRepositories
      tags: [venom]
      summary: List repositories available through the connected GitHub account
      responses:
        "200":
          description: Repositories available to connect
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubRepository"
        "401":
          description: Sign-in required
        "403":
          description: Signed-in user is not authorized for the workspace GitHub connection
        "502":
          description: GitHub connection unavailable
  /venom/projects/{projectId}/sources/github:
    post:
      operationId: connectGitHubSource
      tags: [venom]
      summary: Sync selected GitHub repository context into a project source
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubSourceInput"
      responses:
        "200":
          description: Connected project source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSource"
        "400":
          description: Invalid repository identifier
        "401":
          description: Sign-in required
        "403":
          description: Signed-in user is not authorized for the workspace GitHub connection
        "404":
          description: Repository unavailable
        "502":
          description: GitHub connection unavailable
  /venom/projects/{projectId}/sources/website:
    post:
      operationId: connectWebsiteSource
      tags: [venom]
      summary: Add publicly available website context to a project source
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteSourceInput"
      responses:
        "200":
          description: Connected project source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSource"
        "400":
          description: Invalid or unsafe website URL
        "422":
          description: Website content could not be read
        "502":
          description: Website could not be reached
  /venom/workspace:
    get:
      operationId: getVenomWorkspace
      tags: [venom]
      summary: Get the signed-in user's workspace
      responses:
        "200":
          description: Current cloud workspace, or an empty envelope for a new account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "401":
          description: Authentication required
    put:
      operationId: saveVenomWorkspace
      tags: [venom]
      summary: Save the signed-in user's workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomWorkspaceSaveInput"
      responses:
        "200":
          description: Saved workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "401":
          description: Authentication required
        "409":
          description: The cloud workspace changed on another device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "413":
          description: The workspace exceeds the supported cloud snapshot size
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                  maxBytes:
                    type: number
                    multipleOf: 1
                    minimum: 1
                required: [error, maxBytes]
  /venom/workspaces:
    get:
      operationId: listSharedWorkspaces
      tags: [venom]
      summary: List the shared workspaces the signed-in user belongs to
      responses:
        "200":
          description: Shared workspaces with the caller's role in each
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/SharedWorkspace" }
        "401": { description: Authentication required }
    post:
      operationId: createSharedWorkspace
      tags: [venom]
      summary: Create a shared workspace with the caller as its first admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedWorkspaceCreateInput" }
      responses:
        "201":
          description: Shared workspace created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspace" }
        "400": { description: Invalid workspace name }
        "401": { description: Authentication required }
  /venom/workspaces/{workspaceId}/members:
    get:
      operationId: listSharedWorkspaceMembers
      tags: [venom]
      summary: List the members of a shared workspace (members only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
      responses:
        "200":
          description: Current members and their roles
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: "#/components/schemas/SharedWorkspaceMember" }
        "401": { description: Authentication required }
        "403":
          description: The caller is not currently a member of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
    post:
      operationId: addSharedWorkspaceMember
      tags: [venom]
      summary: Add an account to a shared workspace (admins only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedWorkspaceMemberInput" }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceMember" }
        "400": { description: Invalid member request }
        "401": { description: Authentication required }
        "403":
          description: The caller is not an admin of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404": { description: No account matches the supplied user ID }
        "409": { description: The account is already a member }
  /venom/workspaces/{workspaceId}/members/{memberUserId}:
    patch:
      operationId: updateSharedWorkspaceMemberRole
      tags: [venom]
      summary: Change a member's role in place; their access never lapses (admins only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedWorkspaceMemberRoleInput" }
      responses:
        "200":
          description: The member with their updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceMember" }
        "400": { description: Invalid role payload }
        "401": { description: Authentication required }
        "403":
          description: The caller is not an admin of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404": { description: The account is not a member of this workspace }
        "409": { description: The last admin cannot be demoted }
    delete:
      operationId: removeSharedWorkspaceMember
      tags: [venom]
      summary: Remove a member; their workspace access ends at their next request (admins only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Membership revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  removedUserId: { type: string, minLength: 1, maxLength: 160 }
                required: [removedUserId]
        "401": { description: Authentication required }
        "403":
          description: The caller is not an admin of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404": { description: The account is not a member of this workspace }
        "409": { description: The last admin cannot be removed }
  /venom/workspaces/{workspaceId}/knowledge:
    get:
      operationId: getSharedWorkspaceKnowledge
      tags: [venom]
      summary: Read a shared workspace's knowledge clusters (members only)
      description: >-
        Workspace-tier knowledge is served exclusively through this
        membership-checked endpoint and is never embedded in any per-user
