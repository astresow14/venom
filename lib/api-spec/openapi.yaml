  /venom/workspaces/{workspaceId}/knowledge/{conceptId}/restriction:
    patch:
      operationId: setSharedWorkspaceConceptRestriction
      tags: [venom]
      summary: Restrict a workspace knowledge cluster to admins (admins only)
      description: >-
        Marks or unmarks a cluster as admin-only. Restricted clusters are
        enforced server-side per request, like membership: they never appear
        in member knowledge reads, member chat context, member citations, or
        member exports. Non-admin callers get the same opaque 403 as
        non-members.
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
        - $ref: "#/components/parameters/WorkspaceConceptId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestrictionUpdateInput" }
      responses:
        "200":
          description: Updated cluster with its new restriction state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomKnowledgeCluster" }
        "400": { description: Invalid restriction payload }
        "401": { description: Authentication required }
        "403":
          description: The caller is not an admin of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404": { description: Knowledge cluster not found in this workspace }
  /venom/workspaces/{workspaceId}/sops/{sopId}/restriction:
    patch:
      operationId: setSharedWorkspaceSopRestriction
      tags: [venom]
      summary: Restrict a workspace SOP to admins (admins only)
      description: >-
        Marks or unmarks a SOP as admin-only. Restricted SOPs are enforced
        server-side per request, like membership: they never appear in member
        SOP reads, member chat context, or member exports. Non-admin callers
        get the same opaque 403 as non-members.
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
        - $ref: "#/components/parameters/SopId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestrictionUpdateInput" }
      responses:
        "200":
          description: Updated SOP with its new restriction state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceSop" }
        "400": { description: Invalid restriction payload }
        "401": { description: Authentication required }
        "403":
          description: The caller is not an admin of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404": { description: SOP not found in this workspace }
  /venom/workspaces/{workspaceId}/export/{kind}:
    get:
      operationId: exportSharedWorkspaceMarkdown
      tags: [venom]
      summary: Download workspace knowledge or SOPs as Markdown (members only)
      description: >-
        The export policy is enforced here, server-side. When the workspace
        forbids sensitive exports, locked items are excluded and the file
        states how many were withheld — never a silent gap. Non-members get
        no workspace content at all.
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
        - $ref: "#/components/parameters/VenomExportKind"
      responses:
        "200":
          description: Markdown attachment
          content:
            text/markdown:
              schema: { type: string, maxLength: 400000 }
        "401": { description: Authentication required }
        "403":
          description: The caller is not currently a member of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
  /venom/exports/{kind}:
    get:
      operationId: exportVenomPersonalMarkdown
      tags: [venom]
      summary: Download your personal Brain notes or SOPs as Markdown
      description: >-
        Always scoped to the requesting account's personal tier; contains no
        workspace content, so it keeps working after leaving a workspace.
      parameters:
        - $ref: "#/components/parameters/VenomExportKind"
        - name: scope
          in: query
          required: false
          description: >-
            Brain exports only. `sorted` limits the download to knowledge
            outside the Unsorted holding area; `unsorted` downloads just the
            Unsorted items. Omit for everything.
          schema:
            type: string
            enum: [sorted, unsorted]
      responses:
        "200":
          description: Markdown attachment
          content:
            text/markdown:
              schema: { type: string, maxLength: 400000 }
        "401": { description: Authentication required }
