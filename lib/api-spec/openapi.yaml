      required: [voiceId, name, content, status]
    VenomMessageDeliberation:
      type: object
      additionalProperties: false
      properties:
        voices:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/VenomDeliberationTake"
        disagreements:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 500
      required: [voices, disagreements]
    VenomMessage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 50000
        createdAt:
          type: number
          multipleOf: 1
          minimum: 0
        status:
          type: string
          enum: [sending, sent, error]
        modelId:
          $ref: "#/components/schemas/VenomModelId"
        modelName:
          type: string
          minLength: 1
          maxLength: 80
        deliberation:
          $ref: "#/components/schemas/VenomMessageDeliberation"
        speakerId:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Debate voice identity behind this assistant turn. Absent for
            ordinary replies, so older clients render debate turns as plain
            assistant messages.
        speakerName:
          type: string
          minLength: 1
          maxLength: 80
          description: Display name of the debate voice behind this assistant turn.
      required: [id, role, content, createdAt, status]
    VenomConversation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: string
          minLength: 1
          maxLength: 200
        projectId:
          type: [string, "null"]
          maxLength: 120
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
        messages:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/VenomMessage"
        responseMode:
          $ref: "#/components/schemas/VenomResponseMode"
        blend:
          $ref: "#/components/schemas/VenomConversationBlend"
        modeUpdatedAt:
          type: number
          multipleOf: 1
          minimum: 0
          description: >-
            When the response mode or blend last changed on any device; the
            newer block wins in cross-device merges.
      required: [id, title, projectId, updatedAt, messages]
    VenomConversationBlend:
      type: object
      additionalProperties: false
      description: >-
        The blend pad position for this conversation, stored as the three
        corner identities and their normalized weights.
      properties:
        corners:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 64
        weights:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            minimum: 0
            maximum: 1
      required: [corners, weights]
    VenomKnowledgeSource:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: string
          minLength: 1
          maxLength: 120
        projectId:
          type: [string, "null"]
          maxLength: 120
        conversationTitle:
          type: string
          minLength: 1
          maxLength: 200
        messageIds:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 120
        excerpt:
          type: string
          maxLength: 2000
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
        capturedByUserId:
          description: >-
            Clerk user id of the account whose chat produced this evidence.
            Null for knowledge captured before attribution existed; renderers
            then attribute it to the ontology owner. The server discards
            stamps that name anyone other than the owner when absorbing
            client snapshots, so the value is trustworthy.
          type: [string, "null"]
          maxLength: 120
        capturedAt:
          description: >-
            When the capture that produced this evidence was filed, in ms
            since epoch. Null for pre-attribution evidence; renderers then
            fall back to updatedAt.
          type: [number, "null"]
          multipleOf: 1
          minimum: 0
      required:
        [conversationId, projectId, conversationTitle, messageIds, excerpt, updatedAt]
    VenomKnowledgeCluster:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        projectId:
          type: [string, "null"]
          maxLength: 120
        label:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        strength:
          type: number
          minimum: 0
          maximum: 1
        x:
          type: number
        y:
          type: number
        links:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 120
        description:
          type: string
          maxLength: 2000
        summary:
          type: string
          maxLength: 2000
        mentionCount:
          type: number
          multipleOf: 1
          minimum: 0
        lastUpdatedAt:
          type: number
          multipleOf: 1
          minimum: 0
        sources:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/VenomKnowledgeSource"
      required:
        [id, projectId, label, category, strength, x, y, links, summary, mentionCount, lastUpdatedAt, sources]
    VenomDeletionMarker:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        deletedAt:
          type: number
          multipleOf: 1
          minimum: 0
        replaced:
          description: >-
            True when the entity was retired because a newer snapshot took its
            place (a source refresh), rather than deleted outright. A replaced
            entity can never come back, so the tombstone wins regardless of how
            recent an incoming copy claims to be.
          type: boolean
      required: [id, deletedAt]
