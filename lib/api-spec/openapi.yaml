openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: venom
    description: Venom AI assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /venom/respond:
    post:
      operationId: sendVenomMessage
      tags: [venom]
      summary: Stream a response from the Venom assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomChatRequest"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "401":
          description: Authentication required
  /venom/knowledge/extract:
    post:
      operationId: extractVenomKnowledge
      tags: [venom]
      summary: Extract knowledge clusters from a project conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeExtractionInput"
      responses:
        "200":
          description: Knowledge clusters found in the conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExtraction"
        "401":
          description: Authentication required
        "429":
          description: Too many extraction requests
  /venom/notes/improve:
    post:
      operationId: improveVenomNote
      tags: [venom]
      summary: Improve the grammar and organization of a draft project note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomNoteInput"
      responses:
        "200":
          description: An editable suggestion and concise summary of changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomNoteImprovement"
        "401":
          description: Authentication required
        "429":
          description: Too many note improvement requests
  /venom/github/repositories:
    get:
      operationId: getGitHubRepositories
      tags: [venom]
      summary: List repositories available through the connected GitHub account
      responses:
        "200":
          description: Repositories available to connect
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubRepository"
        "401":
          description: Sign-in required
        "403":
          description: Signed-in user is not authorized for the workspace GitHub connection
        "502":
          description: GitHub connection unavailable
  /venom/projects/{projectId}/sources/github:
    post:
      operationId: connectGitHubSource
      tags: [venom]
      summary: Sync selected GitHub repository context into a project source
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubSourceInput"
      responses:
        "200":
          description: Connected project source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSource"
        "400":
          description: Invalid repository identifier
        "401":
          description: Sign-in required
        "403":
          description: Signed-in user is not authorized for the workspace GitHub connection
        "404":
          description: Repository unavailable
        "502":
          description: GitHub connection unavailable
  /venom/projects/{projectId}/sources/website:
    post:
      operationId: connectWebsiteSource
      tags: [venom]
      summary: Add publicly available website context to a project source
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteSourceInput"
      responses:
        "200":
          description: Connected project source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSource"
        "400":
          description: Invalid or unsafe website URL
        "422":
          description: Website content could not be read
        "502":
          description: Website could not be reached
  /venom/workspace:
    get:
      operationId: getVenomWorkspace
      tags: [venom]
      summary: Get the signed-in user's workspace
      responses:
        "200":
          description: Current cloud workspace, or an empty envelope for a new account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "401":
          description: Authentication required
    put:
      operationId: saveVenomWorkspace
      tags: [venom]
      summary: Save the signed-in user's workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomWorkspaceSaveInput"
      responses:
        "200":
          description: Saved workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "401":
          description: Authentication required
        "409":
          description: The cloud workspace changed on another device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "413":
          description: The workspace exceeds the supported cloud snapshot size
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                  maxBytes:
                    type: number
                    multipleOf: 1
                    minimum: 1
                required: [error, maxBytes]
  /venom/apps:
    get:
      operationId: listVenomApps
      tags: [venom]
      summary: List the signed-in user's portfolio apps
      responses:
        "200":
          description: Account-owned app records
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: "#/components/schemas/VenomApp"
        "401":
          description: Authentication required
    post:
      operationId: createVenomApp
      tags: [venom]
      summary: Create an app portfolio record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomAppInput"
      responses:
        "201":
          description: Created app record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomApp"
        "400":
          description: Invalid app metadata
        "401":
          description: Authentication required
  /venom/apps/{appId}:
    get:
      operationId: getVenomApp
      tags: [venom]
      summary: Get an app and its source history
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Account-owned app detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomAppDetail"
        "401":
          description: Authentication required
        "404":
          description: App not found
    patch:
      operationId: updateVenomApp
      tags: [venom]
      summary: Update app metadata
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomAppUpdate"
      responses:
        "200":
          description: Updated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomApp"
        "400":
          description: Invalid app metadata
        "401":
          description: Authentication required
        "404":
          description: App not found
    delete:
      operationId: deleteVenomApp
      tags: [venom]
      summary: Delete an app record and its private source packages
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "204":
          description: App deleted
        "401":
          description: Authentication required
        "404":
          description: App not found
  /venom/apps/{appId}/versions:
    get:
      operationId: listVenomAppVersions
      tags: [venom]
      summary: List immutable source versions for an app
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Source version history
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: "#/components/schemas/VenomSourceVersion"
        "401":
          description: Authentication required
        "404":
          description: App not found
  /venom/apps/{appId}/imports:
    post:
      operationId: createVenomAppImport
      tags: [venom]
      summary: Start a private ZIP source import
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomImportInput"
      responses:
        "201":
          description: Private upload ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomImportUploadTicket"
        "400":
          description: Invalid archive metadata
        "401":
          description: Authentication required
        "404":
          description: App not found
        "413":
          description: Archive exceeds the upload limit
        "415":
          description: Only ZIP archives are accepted
  /venom/apps/{appId}/imports/{importJobId}:
    get:
      operationId: getVenomAppImport
      tags: [venom]
      summary: Get a ZIP import's observable status
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/ImportJobId"
      responses:
        "200":
          description: Current import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomImportJob"
        "401":
          description: Authentication required
        "404":
          description: Import not found
  /venom/apps/{appId}/imports/{importJobId}/complete:
    post:
      operationId: completeVenomAppImportUpload
      tags: [venom]
      summary: Confirm upload and start bounded archive inspection
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/ImportJobId"
      responses:
        "202":
          description: Import accepted for validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomImportJob"
        "401":
          description: Authentication required
        "404":
          description: Import not found
        "409":
          description: Import cannot be completed from its current state
        "422":
          description: Uploaded object is unavailable
  /venom/apps/{appId}/imports/{importJobId}/retry:
    post:
      operationId: retryVenomAppImport
      tags: [venom]
      summary: Create a fresh private upload target for a failed import
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/ImportJobId"
      responses:
        "200":
          description: Fresh upload ticket for the same import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomImportUploadTicket"
        "401":
          description: Authentication required
        "404":
          description: Import not found
        "409":
          description: Only failed imports can be retried
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    ImportJobId:
      name: importJobId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
  schemas:
    VenomAppStatus:
      type: string
      enum: [draft, importing, ready, attention]
    VenomImportStatus:
      type: string
      enum:
        [awaiting_upload, uploading, validating, inspecting, complete, failed]
    VenomApp:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/VenomAppStatus"
        detectedStack:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 60
        sourceType:
          type: string
          enum: [none, zip]
        sourceVersion:
          type: number
          multipleOf: 1
          minimum: 0
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
        importStatus:
          oneOf:
            - $ref: "#/components/schemas/VenomImportStatus"
            - type: "null"
        sourceUpdatedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, name, purpose, brand, status, detectedStack, sourceType, sourceVersion, deploymentUrl, importStatus, sourceUpdatedAt, createdAt, updatedAt]
    VenomAppInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
      required: [name, purpose, brand]
    VenomAppUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/VenomAppStatus"
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
    VenomSourceManifest:
      type: object
      additionalProperties: false
      properties:
        formatVersion:
          type: number
          const: 1
        rootKind:
          type: string
          enum: [single-project, monorepo]
        totalEntries:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 5000
        safeFileCount:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 5000
        excludedSensitiveFileCount:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 5000
        files:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 240
        projectFiles:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 240
        detectedStack:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 60
      required:
        [formatVersion, rootKind, totalEntries, safeFileCount, excludedSensitiveFileCount, files, projectFiles, detectedStack]
    VenomSourceVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        versionNumber:
          type: number
          multipleOf: 1
          minimum: 1
        sourceType:
          type: string
          enum: [zip]
        archiveFilename:
          type: string
          minLength: 1
          maxLength: 160
        archiveBytes:
          type: number
          multipleOf: 1
          minimum: 1
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifest:
          $ref: "#/components/schemas/VenomSourceManifest"
        createdAt:
          type: string
          format: date-time
      required:
        [id, versionNumber, sourceType, archiveFilename, archiveBytes, checksumSha256, manifest, createdAt]
    VenomImportJob:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        appId:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        archiveFilename:
          type: string
          minLength: 1
          maxLength: 160
        declaredBytes:
          type: number
          multipleOf: 1
          minimum: 1
        status:
          $ref: "#/components/schemas/VenomImportStatus"
        progress:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 100
        failureCode:
          type: [string, "null"]
          maxLength: 80
        failureMessage:
          type: [string, "null"]
          maxLength: 240
        sourceVersionId:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F-]{36}$"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
      required:
        [id, appId, archiveFilename, declaredBytes, status, progress, failureCode, failureMessage, sourceVersionId, createdAt, updatedAt, completedAt]
    VenomDeploymentLink:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        label:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          maxLength: 2048
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, label, url, isPrimary, createdAt]
    VenomAppDetail:
      type: object
      additionalProperties: false
      properties:
        app:
          $ref: "#/components/schemas/VenomApp"
        versions:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/VenomSourceVersion"
        importJobs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VenomImportJob"
        deploymentLinks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/VenomDeploymentLink"
      required: [app, versions, importJobs, deploymentLinks]
    VenomImportInput:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^.*\\.[zZ][iI][pP]$"
        size:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 52428800
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
      required: [filename, size, idempotencyKey]
    VenomImportUploadTicket:
      type: object
      additionalProperties: false
      properties:
        job:
          $ref: "#/components/schemas/VenomImportJob"
        uploadUrl:
          type: string
          maxLength: 8192
        maxBytes:
          type: number
          const: 52428800
        requiredContentType:
          type: string
          const: application/zip
      required: [job, uploadUrl, maxBytes, requiredContentType]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VenomChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content
    VenomChatRequest:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/VenomChatMessage"
        projectContext:
          type: string
          maxLength: 8000
        projectId:
          type: string
          minLength: 1
          maxLength: 160
        sourceCitationIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,160}$"
        sourceSnapshots:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/AttestedSourceSnapshot"
      required:
        - messages
        - projectId
    KnowledgeConversation:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        title:
          type: string
          minLength: 1
          maxLength: 160
        projectId:
          type: [string, "null"]
          maxLength: 160
    KnowledgeMessage:
      type: object
      additionalProperties: false
      required: [id, role, content]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 8000
    KnowledgeExtractionInput:
      type: object
      additionalProperties: false
      required: [conversation, messages]
      properties:
        conversation:
          $ref: "#/components/schemas/KnowledgeConversation"
        messages:
          type: array
          minItems: 1
          maxItems: 48
          items:
            $ref: "#/components/schemas/KnowledgeMessage"
    KnowledgeCandidate:
      type: object
      additionalProperties: false
      required:
        [label, category, confidence, summary, sourceMessageIds, relatedLabels]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
        category:
          type: string
          minLength: 1
          maxLength: 32
        confidence:
          type: number
          minimum: 0
          maximum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 240
        sourceMessageIds:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 160
        relatedLabels:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 64
    KnowledgeExtraction:
      type: object
      additionalProperties: false
      required: [clusters]
      properties:
        clusters:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/KnowledgeCandidate"
    VenomNoteInput:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 5000
    VenomNoteImprovement:
      type: object
      additionalProperties: false
      required: [suggestion, changeNotes]
      properties:
        suggestion:
          type: string
          minLength: 1
          maxLength: 5000
        changeNotes:
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 160
    GitHubRepository:
      type: object
      required: [fullName, name, url, updatedAt]
      properties:
        fullName:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        url:
          type: string
        updatedAt:
          type: string
          format: date-time
    GitHubSourceInput:
      type: object
      required: [repository]
      properties:
        repository:
          type: string
          minLength: 3
          maxLength: 200
    WebsiteSourceInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
        name:
          type: string
          minLength: 1
          maxLength: 120
    SourceCitation:
      type: object
      additionalProperties: false
      required: [id, provider, kind, title, url, excerpt, reference]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Za-z0-9_-]{1,160}$"
        provider:
          type: string
          enum: [github, website]
        kind:
          type: string
          enum: [repository, issue, pull_request, website]
        title:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          maxLength: 2048
        excerpt:
          type: string
          minLength: 1
          maxLength: 1000
        reference:
          type: ["string", "null"]
          minLength: 1
          maxLength: 200
    SourceCluster:
      type: object
      required: [id, label, category, strength, citationIds]
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
        strength:
          type: number
          minimum: 0
          maximum: 1
        citationIds:
          type: array
          items:
            type: string
    AttestedSourceSnapshot:
      type: object
      additionalProperties: false
      required: [id, context, citations, attestation]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Za-z0-9_-]{1,160}$"
        context:
          type: string
          minLength: 1
          maxLength: 8000
        citations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/SourceCitation"
        attestation:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: "^v1\\.[A-Za-z0-9_-]{2,214}\\.[a-f0-9]{64}\\.[A-Za-z0-9_-]{43}$"
    ProjectSource:
      type: object
      required:
        [id, projectId, provider, name, url, status, syncedAt, summary, context, citations, clusters]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        projectId:
          type: string
          minLength: 1
          maxLength: 160
