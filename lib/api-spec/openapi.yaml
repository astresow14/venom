openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: venom
    description: Venom AI assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /venom/respond:
    post:
      operationId: sendVenomMessage
      tags: [venom]
      summary: Stream a response from the Venom assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomChatRequest"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "401":
          description: Authentication required
        "403":
          description: The caller requested a shared workspace they are not currently a member of
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "429":
          description: Per-account managed chat limit reached
        "502":
          description: Selected managed provider is unavailable
  /venom/models:
    get:
      operationId: getVenomModels
      tags: [venom]
      summary: List the server-managed text models available to Venom
      responses:
        "200":
          description: Sanitized managed model catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenomManagedModel"
        "401":
          description: Authentication required
  /venom/deliberation:
    get:
      operationId: getVenomDeliberation
      tags: [venom]
      summary: Describe multi-voice deliberation availability and its voice roster
      responses:
        "200":
          description: Deliberation availability and the neutral voice roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomDeliberationAvailability"
        "401":
          description: Authentication required
  /venom/voice/catalog:
    get:
      operationId: getVenomVoices
      tags: [venom]
      summary: List the named voice presets for hands-free voice chat
      responses:
        "200":
          description: Named voice presets mapped to server-managed voices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenomVoicePreset"
        "401":
          description: Authentication required
  /venom/voice/transcribe:
    post:
      operationId: transcribeVenomVoice
      tags: [venom]
      summary: Transcribe one spoken utterance to text
      description: >-
        Audio is processed transiently in memory and never persisted or
        logged; only the recognized text is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomVoiceTranscriptionRequest"
      responses:
        "200":
          description: The recognized text of the utterance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomVoiceTranscription"
        "400":
          description: Invalid transcription request
        "401":
          description: Authentication required
        "429":
          description: Too many transcription requests
        "503":
          description: Voice is unavailable because the OpenAI audio integration is not configured
  /venom/voice/speak:
    post:
      operationId: speakVenomVoice
      tags: [venom]
      summary: Stream spoken audio for a piece of assistant text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomVoiceSpeechRequest"
      responses:
        "200":
          description: SSE stream of base64 PCM16 audio chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid speech request
        "401":
          description: Authentication required
        "429":
          description: Too many speech requests
        "503":
          description: Voice is unavailable because the OpenAI audio integration is not configured
  /venom/voice/decide:
    post:
      operationId: decideVenomVoiceTurn
      tags: [venom]
      summary: Decide whether a finished spoken turn deserves a reply, a brief acknowledgment, or silence
      description: >-
        Classifies one finished voice turn from its transcript and recent
        conversation momentum. Hard-biased toward responding: questions and
        direct requests always get a full reply, and any uncertainty or
        internal failure resolves to "respond". Applies only to voice mode;
        typed chat never consults this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomVoiceTurnDecisionRequest"
      responses:
        "200":
          description: The restraint decision for this turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomVoiceTurnDecision"
        "400":
          description: Invalid decision request
        "401":
          description: Authentication required
        "429":
          description: Too many decision requests
  /venom/voice/decision-outcome:
    post:
      operationId: reportVenomVoiceDecisionOutcome
      tags: [venom]
      summary: Record what actually happened after a speak/stay-quiet decision
      description: >-
        Pairs a prior decision with its observed outcome (reply interrupted,
        user re-asked after silence, session wound down cleanly, ...) so
        restraint thresholds can be tuned from real usage. No audio is ever
        attached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomVoiceDecisionOutcomeRequest"
      responses:
        "200":
          description: Whether the outcome was recorded against a known decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomVoiceDecisionOutcomeResult"
        "400":
          description: Invalid outcome report
        "401":
          description: Authentication required
        "429":
          description: Too many outcome reports
  /venom/knowledge/extract:
    post:
      operationId: extractVenomKnowledge
      tags: [venom]
      summary: Extract knowledge clusters from a project conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeExtractionInput"
      responses:
        "200":
          description: Knowledge clusters found in the conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExtraction"
        "401":
          description: Authentication required
        "403":
          description: The caller requested a shared workspace they are not currently a member of
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "429":
          description: Too many extraction requests
  /venom/ontology/search:
    get:
      operationId: searchVenomOntology
      tags: [venom]
      summary: Search the signed-in user's knowledge ontology across projects
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Concepts matching the query, best matches first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOntologySearchResponse"
        "400":
          description: Invalid search query
        "401":
          description: Authentication required
  /venom/ontology/concepts/{conceptId}:
    get:
      operationId: getVenomOntologyConcept
      tags: [venom]
      summary: Get one ontology concept with its neighbors and evidence
      parameters:
        - name: conceptId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: The concept, its linked neighbors, and its evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOntologyConceptDetail"
        "401":
          description: Authentication required
        "404":
          description: Concept not found
  /venom/identity:
    get:
      operationId: getVenomIdentity
      tags: [venom]
      summary: Who Venom recognizes the signed-in account as
      description: >-
        Resolves the signed-in account into its per-user identity record
        (display name, email, sign-in provider), creating the record on
        first authenticated use and refreshing it when stale.
      responses:
        "200":
          description: The recognized identity for the signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomIdentity"
        "401":
          description: Authentication required
  /venom/notes/improve:
    post:
      operationId: improveVenomNote
      tags: [venom]
      summary: Improve the grammar and organization of a draft project note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomNoteInput"
      responses:
        "200":
          description: An editable suggestion and concise summary of changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomNoteImprovement"
        "401":
          description: Authentication required
        "429":
          description: Too many note improvement requests
  /venom/github/repositories:
    get:
      operationId: getGitHubRepositories
      tags: [venom]
      summary: List repositories available through the connected GitHub account
      responses:
        "200":
          description: Repositories available to connect
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubRepository"
        "401":
          description: Sign-in required
        "403":
          description: Signed-in user is not authorized for the workspace GitHub connection
        "502":
          description: GitHub connection unavailable
  /venom/projects/{projectId}/sources/github:
    post:
      operationId: connectGitHubSource
      tags: [venom]
      summary: Sync selected GitHub repository context into a project source
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubSourceInput"
      responses:
        "200":
          description: Connected project source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSource"
        "400":
          description: Invalid repository identifier
        "401":
          description: Sign-in required
        "403":
          description: Signed-in user is not authorized for the workspace GitHub connection
        "404":
          description: Repository unavailable
        "502":
          description: GitHub connection unavailable
  /venom/projects/{projectId}/sources/website:
    post:
      operationId: connectWebsiteSource
      tags: [venom]
      summary: Add publicly available website context to a project source
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteSourceInput"
      responses:
        "200":
          description: Connected project source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSource"
        "400":
          description: Invalid or unsafe website URL
        "422":
          description: Website content could not be read
        "502":
          description: Website could not be reached
  /venom/workspace:
    get:
      operationId: getVenomWorkspace
      tags: [venom]
      summary: Get the signed-in user's workspace
      responses:
        "200":
          description: Current cloud workspace, or an empty envelope for a new account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "401":
          description: Authentication required
    put:
      operationId: saveVenomWorkspace
      tags: [venom]
      summary: Save the signed-in user's workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomWorkspaceSaveInput"
      responses:
        "200":
          description: Saved workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "401":
          description: Authentication required
        "409":
          description: The cloud workspace changed on another device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomWorkspaceSnapshot"
        "413":
          description: The workspace exceeds the supported cloud snapshot size
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                  maxBytes:
                    type: number
                    multipleOf: 1
                    minimum: 1
                required: [error, maxBytes]
  /venom/workspaces:
    get:
      operationId: listSharedWorkspaces
      tags: [venom]
      summary: List the shared workspaces the signed-in user belongs to
      responses:
        "200":
          description: Shared workspaces with the caller's role in each
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/SharedWorkspace" }
        "401": { description: Authentication required }
    post:
      operationId: createSharedWorkspace
      tags: [venom]
      summary: Create a shared workspace with the caller as its first admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedWorkspaceCreateInput" }
      responses:
        "201":
          description: Shared workspace created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspace" }
        "400": { description: Invalid workspace name }
        "401": { description: Authentication required }
  /venom/workspaces/{workspaceId}/members:
    get:
      operationId: listSharedWorkspaceMembers
      tags: [venom]
      summary: List the members of a shared workspace (members only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
      responses:
        "200":
          description: Current members and their roles
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: "#/components/schemas/SharedWorkspaceMember" }
        "401": { description: Authentication required }
        "403":
          description: The caller is not currently a member of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
    post:
      operationId: addSharedWorkspaceMember
      tags: [venom]
      summary: Add an account to a shared workspace (admins only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedWorkspaceMemberInput" }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceMember" }
        "400": { description: Invalid member request }
        "401": { description: Authentication required }
        "403":
          description: The caller is not an admin of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404": { description: No account matches the supplied user ID }
        "409": { description: The account is already a member }
  /venom/workspaces/{workspaceId}/members/{memberUserId}:
    delete:
      operationId: removeSharedWorkspaceMember
      tags: [venom]
      summary: Remove a member; their workspace access ends at their next request (admins only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Membership revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  removedUserId: { type: string, minLength: 1, maxLength: 160 }
                required: [removedUserId]
        "401": { description: Authentication required }
        "403":
          description: The caller is not an admin of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404": { description: The account is not a member of this workspace }
        "409": { description: The last admin cannot be removed }
  /venom/workspaces/{workspaceId}/knowledge:
    get:
      operationId: getSharedWorkspaceKnowledge
      tags: [venom]
      summary: Read a shared workspace's knowledge clusters (members only)
      description: >-
        Workspace-tier knowledge is served exclusively through this
        membership-checked endpoint and is never embedded in any per-user
        sync snapshot, so revoking membership revokes access.
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
      responses:
        "200":
          description: Workspace knowledge clusters, strongest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceKnowledge" }
        "401": { description: Authentication required }
        "403":
          description: The caller is not currently a member of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
  /venom/workspaces/{workspaceId}/sops:
    get:
      operationId: listSharedWorkspaceSops
      tags: [venom]
      summary: List a shared workspace's SOPs (members only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
      responses:
        "200":
          description: Workspace-owned SOPs
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: "#/components/schemas/SharedWorkspaceSop" }
        "401": { description: Authentication required }
        "403":
          description: The caller is not currently a member of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
    post:
      operationId: createSharedWorkspaceSop
      tags: [venom]
      summary: Create an SOP owned by the shared workspace (members only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomSopInput" }
      responses:
        "201":
          description: Workspace SOP draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceSop" }
        "400": { description: Invalid or unsafe SOP reference material }
        "401": { description: Authentication required }
        "403":
          description: The caller is not currently a member of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
  /venom/workspaces/{workspaceId}/sops/{sopId}/publish:
    post:
      operationId: publishSharedWorkspaceSop
      tags: [venom]
      summary: Publish the current draft of a workspace SOP (members only)
      parameters:
        - $ref: "#/components/parameters/SharedWorkspaceId"
        - $ref: "#/components/parameters/SopId"
      responses:
        "200":
          description: Immutable revision now active for workspace chat context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomSopRevision" }
        "400": { description: SOP content failed the safety check }
        "401": { description: Authentication required }
        "403":
          description: The caller is not currently a member of this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404": { description: SOP not found in this workspace }
        "409": { description: Archived SOPs cannot be published }
  /venom/apps:
    get:
      operationId: listVenomApps
      tags: [venom]
      summary: List the signed-in user's portfolio apps
      responses:
        "200":
          description: Account-owned app records
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: "#/components/schemas/VenomApp"
        "401":
          description: Authentication required
    post:
      operationId: createVenomApp
      tags: [venom]
      summary: Create an app portfolio record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomAppInput"
      responses:
        "201":
          description: Created app record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomApp"
        "400":
          description: Invalid app metadata
        "401":
          description: Authentication required
  /venom/apps/{appId}:
    get:
      operationId: getVenomApp
      tags: [venom]
      summary: Get an app and its source history
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Account-owned app detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomAppDetail"
        "401":
          description: Authentication required
        "404":
          description: App not found
    patch:
      operationId: updateVenomApp
      tags: [venom]
      summary: Update app metadata
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomAppUpdate"
      responses:
        "200":
          description: Updated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomApp"
        "400":
          description: Invalid app metadata
        "401":
          description: Authentication required
        "404":
          description: App not found
    delete:
      operationId: deleteVenomApp
      tags: [venom]
      summary: Delete an app record and its private source packages
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "204":
          description: App deleted
        "401":
          description: Authentication required
        "404":
          description: App not found
  /venom/apps/{appId}/iteration-context:
    get:
      operationId: getVenomAppIterationContext
      tags: [venom]
      summary: Get the pre-seeded context for improving this app
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Baseline package, latest source version, and data changes since the last iteration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomAppIterationContext"
        "401":
          description: Authentication required
        "404":
          description: App not found
  /venom/apps/{appId}/iterations:
    post:
      operationId: createVenomAppIteration
      tags: [venom]
      summary: Start an improvement build run from the app's approved baseline
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomAppIterationInput"
      responses:
        "201":
          description: Queued improvement run pinned to this app and its baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomBuildRun"
        "400":
          description: Invalid iteration request
        "401":
          description: Authentication required
        "404":
          description: App not found
        "409":
          description: No resolvable baseline package, generation capacity reached, or idempotency conflict
  /venom/apps/{appId}/improvement-suggestion/dismiss:
    post:
      operationId: dismissVenomAppImprovementSuggestion
      tags: [venom]
      summary: Dismiss the current new-data improvement suggestion
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App with the suggestion dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomApp"
        "401":
          description: Authentication required
        "404":
          description: App not found
  /venom/apps/{appId}/timeline:
    get:
      operationId: getVenomAppTimeline
      tags: [venom]
      summary: Page through the app's full evolution timeline
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page; omit for the newest entries
          schema:
            type: string
            maxLength: 300
        - name: limit
          in: query
          required: false
          schema:
            type: number
            multipleOf: 1
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: One page of timeline entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomAppTimelinePage"
        "400":
          description: Invalid cursor or limit
        "401":
          description: Authentication required
        "404":
          description: App not found
  /venom/apps/{appId}/versions:
    get:
      operationId: listVenomAppVersions
      tags: [venom]
      summary: List immutable source versions for an app
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Source version history
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: "#/components/schemas/VenomSourceVersion"
        "401":
          description: Authentication required
        "404":
          description: App not found
  /venom/apps/{appId}/imports:
    post:
      operationId: createVenomAppImport
      tags: [venom]
      summary: Start a private ZIP source import
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomImportInput"
      responses:
        "201":
          description: Private upload ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomImportUploadTicket"
        "400":
          description: Invalid archive metadata
        "401":
          description: Authentication required
        "404":
