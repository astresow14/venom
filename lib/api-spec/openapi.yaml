            assistant messages.
        speakerName:
          type: string
          minLength: 1
          maxLength: 80
          description: Display name of the debate voice behind this assistant turn.
        attachments:
          type: array
          maxItems: 5
          description: >-
            Files carried by this message — uploads on user turns, generated
            files on assistant turns. Optional, so older clients and existing
            history remain valid.
          items:
            $ref: "#/components/schemas/VenomMessageAttachment"
      required: [id, role, content, createdAt, status]
    VenomConversation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: string
          minLength: 1
          maxLength: 200
        projectId:
          type: [string, "null"]
          maxLength: 120
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
        messages:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/VenomMessage"
        responseMode:
          $ref: "#/components/schemas/VenomResponseMode"
        blend:
          $ref: "#/components/schemas/VenomConversationBlend"
        modeUpdatedAt:
          type: number
          multipleOf: 1
          minimum: 0
          description: >-
            When the response mode, blend, or voice picks last changed on any
            device; the newer block wins in cross-device merges.
        voiceModels:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/VenomVoiceModelPick"
          description: >-
            Per-conversation verify voice assignments. Part of the response-mode
            preference block: it merges on modeUpdatedAt with mode and blend so
            a pick made on one device survives another device's snapshot merge.
      required: [id, title, projectId, updatedAt, messages]
    VenomConversationBlend:
      type: object
      additionalProperties: false
      description: >-
        The blend pad position for this conversation, stored as the three
        corner identities and their normalized weights.
      properties:
        corners:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 64
        weights:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            minimum: 0
            maximum: 1
      required: [corners, weights]
    VenomRemoteConversation:
      type: object
      additionalProperties: false
      description: >-
        A conversation served from the synced workspace snapshot for
        read-only viewing. projectName is resolved against the snapshot's own
        project list because the requesting device may not hold the project
        either. Heavy per-message internals (deliberation transcripts) are
        omitted; the payload is the readable exchange.
      properties:
        conversation:
          $ref: "#/components/schemas/VenomConversation"
        projectName:
          type: [string, "null"]
          maxLength: 200
      required: [conversation, projectName]
    VenomKnowledgeSource:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: string
          minLength: 1
          maxLength: 120
        projectId:
          type: [string, "null"]
          maxLength: 120
        conversationTitle:
          type: string
          minLength: 1
          maxLength: 200
        messageIds:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 120
        excerpt:
          type: string
          maxLength: 2000
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
        capturedByUserId:
          description: >-
            Clerk user id of the account whose chat produced this evidence.
            Null for knowledge captured before attribution existed; renderers
            then attribute it to the ontology owner. The server discards
            stamps that name anyone other than the owner when absorbing
            client snapshots, so the value is trustworthy.
          type: [string, "null"]
          maxLength: 120
        capturedAt:
          description: >-
            When the capture that produced this evidence was filed, in ms
            since epoch. Null for pre-attribution evidence; renderers then
            fall back to updatedAt.
          type: [number, "null"]
          multipleOf: 1
          minimum: 0
        sensitive:
          description: >-
            Sensitivity lock on this evidence entry. Server-managed on
            workspace-tier knowledge: set only through the sensitivity
            endpoints, never through client snapshots. Locked evidence stays
            visible to members but is withheld from exports when the
            workspace's export policy forbids sensitive content leaving.
          type: boolean
      required:
        [conversationId, projectId, conversationTitle, messageIds, excerpt, updatedAt]
    VenomKnowledgeCluster:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        projectId:
          type: [string, "null"]
          maxLength: 120
        label:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        strength:
          type: number
          minimum: 0
          maximum: 1
        x:
          type: number
        y:
          type: number
        links:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 120
        description:
          type: string
          maxLength: 2000
        summary:
          type: string
          maxLength: 2000
        mentionCount:
          type: number
          multipleOf: 1
          minimum: 0
        lastUpdatedAt:
          type: number
          multipleOf: 1
          minimum: 0
        sources:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/VenomKnowledgeSource"
        sensitive:
          description: >-
            Sensitivity lock on the whole cluster. Server-managed on
            workspace-tier knowledge: set only through the sensitivity
            endpoints, never through client snapshots. Locked clusters stay
            visible to members but are withheld from exports when the
            workspace's export policy forbids sensitive content leaving.
          type: boolean
        adminOnly:
          description: >-
            Admin-only restriction on the whole cluster. Set only by
            workspace admins through the restriction endpoint. Restricted
            clusters are filtered out of member reads, member chat context,
            member citations, and member exports server-side, so a non-admin
            response never carries a restricted cluster at all — when this
            flag is true, the reader is an admin.
          type: boolean
        unsorted:
          description: >-
            Author-private Unsorted holding state, used when scope
            classification was not confident enough to file the cluster.
            Lives only on personal-tier records: it syncs across the
            author's own devices but never appears in workspace reads or
            workspace exports. Cleared when the concept is clarified —
            by a confident re-extraction, an automatic re-file, or the
            author sorting it by hand.
          type: boolean
      required:
        [id, projectId, label, category, strength, x, y, links, summary, mentionCount, lastUpdatedAt, sources]
    VenomDeletionMarker:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        deletedAt:
          type: number
          multipleOf: 1
          minimum: 0
        replaced:
          description: >-
            True when the entity was retired because a newer snapshot took its
            place (a source refresh), rather than deleted outright. A replaced
            entity can never come back, so the tombstone wins regardless of how
            recent an incoming copy claims to be.
          type: boolean
      required: [id, deletedAt]
    VenomWorkspaceTombstones:
      type: object
      additionalProperties: false
      properties:
        projects:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        tasks:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        conversations:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        messages:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        clusters:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        stages:
          type: array
          maxItems: 15000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        fields:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        sources:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
      required: [projects, tasks, conversations, messages, clusters, stages, fields, sources]
    VenomArchivedCitation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Za-z0-9_-]{1,160}$"
        title:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          maxLength: 2048
        retiredAt:
          type: number
          multipleOf: 1
          minimum: 0
      required: [id, title, url, retiredAt]
    VenomWorkspaceState:
      type: object
      additionalProperties: false
      properties:
        projects:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/VenomProject"
        conversations:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/VenomConversation"
        clusters:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/VenomKnowledgeCluster"
        sources:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ProjectSource"
        activeProjectId:
          type: [string, "null"]
          maxLength: 120
        activeConversationId:
          type: [string, "null"]
          maxLength: 120
        tombstones:
          $ref: "#/components/schemas/VenomWorkspaceTombstones"
        modelPreferences:
          $ref: "#/components/schemas/VenomModelPreferences"
        voicePreferences:
          $ref: "#/components/schemas/VenomVoicePreferences"
        archivedCitations:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/VenomArchivedCitation"
      required:
        - projects
        - conversations
        - clusters
        - sources
        - activeProjectId
        - activeConversationId
    VenomWorkspaceSaveInput:
      type: object
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/VenomWorkspaceState"
        baseRevision:
          type: number
          multipleOf: 1
          minimum: 0
      required: [state, baseRevision]
    VenomWorkspaceSnapshot:
      type: object
      additionalProperties: false
      properties:
        state:
          oneOf:
            - $ref: "#/components/schemas/VenomWorkspaceState"
            - type: "null"
        revision:
          type: number
          multipleOf: 1
          minimum: 0
        updatedAt:
          type: [string, "null"]
          format: date-time
      required: [state, revision, updatedAt]
    Uuid:
      type: string
      pattern: "^[0-9a-fA-F-]{36}$"
    VenomAppSharingState:
      type: object
      additionalProperties: false
      description: >-
        Owner-only view of an app's public sharing state. The slug is stable
        for the lifetime of the app: disabling sharing keeps it reserved so
        re-enabling restores the same link. shareUrl/embedUrl/embedSnippet are
        server-composed from the request origin and are null while sharing is
        disabled.
      required:
        - appId
        - enabled
        - slug
        - shareUrl
        - embedUrl
        - embedSnippet
        - publicStatus
        - liveIterationNumber
        - livePublishedAt
      properties:
        appId: { $ref: "#/components/schemas/Uuid" }
        enabled:
          type: boolean
        slug:
          type: [string, "null"]
          maxLength: 60
        shareUrl:
          type: [string, "null"]
          maxLength: 2048
        embedUrl:
          type: [string, "null"]
          maxLength: 2048
        embedSnippet:
          type: [string, "null"]
          maxLength: 4096
        publicStatus:
          type: string
          enum: [live, unavailable]
        liveIterationNumber:
          oneOf:
            - type: number
              multipleOf: 1
              minimum: 1
            - type: "null"
        livePublishedAt:
          type: [string, "null"]
          format: date-time
    VenomAppSharingUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    VenomAppAiOverview:
      type: object
      additionalProperties: false
      description: >-
        Owner-only view of an app's whitelabeled AI: month-to-date usage from
        the canonical ledger, spend controls, and a summary of the gateway
        credential. Never contains the credential secret, provider names, or
        per-token rates — costs are aggregated dollars and models are Venom
        aliases only.
      required:
        - appId
        - paused
        - monthlyCapUsd
        - safetyCapUsd
        - credential
        - usage
        - ownerMonthUsd
      properties:
        appId: { $ref: "#/components/schemas/Uuid" }
        paused:
          type: boolean
        monthlyCapUsd:
          oneOf:
            - type: number
              minimum: 0
            - type: "null"
        safetyCapUsd:
          type: number
          minimum: 0
        credential:
          oneOf:
            - $ref: "#/components/schemas/VenomAppAiCredentialSummary"
            - type: "null"
        usage:
          $ref: "#/components/schemas/VenomAppAiUsage"
        ownerMonthUsd:
          type: number
          minimum: 0
    VenomAppAiCredentialSummary:
      type: object
      additionalProperties: false
      description: >-
        Display-safe credential summary. The prefix identifies the key for
        the owner; the secret itself is only ever delivered into the
        provisioned app's secret storage.
      required: [displayPrefix, createdAt, lastUsedAt, delivered]
      properties:
        displayPrefix:
          type: string
          maxLength: 20
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        delivered:
          type: boolean
    VenomAppAiUsage:
      type: object
      additionalProperties: false
      required:
        - periodStart
        - periodEnd
        - costUsd
        - requests
        - promptTokens
        - outputTokens
        - hasEstimates
        - models
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        costUsd:
          type: number
          minimum: 0
        requests:
          type: number
          multipleOf: 1
          minimum: 0
        promptTokens:
          type: number
          multipleOf: 1
          minimum: 0
        outputTokens:
          type: number
          multipleOf: 1
          minimum: 0
        hasEstimates:
          type: boolean
        models:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/VenomAppAiModelUsage"
    VenomAppAiModelUsage:
      type: object
      additionalProperties: false
      required: [modelId, modelName, costUsd, requests]
      properties:
        modelId:
          type: string
          maxLength: 80
        modelName:
          type: string
          maxLength: 120
        costUsd:
          type: number
          minimum: 0
        requests:
          type: number
          multipleOf: 1
          minimum: 0
    VenomAppAiSettingsUpdate:
      type: object
      additionalProperties: false
      description: >-
        Full settings write: both fields are explicit on every update. The
        cap is dollars per calendar month (UTC); null removes the owner cap
        while the global safety cap keeps applying.
      required: [monthlyCapUsd, paused]
      properties:
        monthlyCapUsd:
          oneOf:
            - type: number
              minimum: 0.01
              maximum: 100000
            - type: "null"
        paused:
          type: boolean
    VenomPublicAppShare:
      type: object
      additionalProperties: false
      description: >-
        Public resolution of a share slug. Never contains owner identity,
        provider identifiers, or release internals. All unavailable states
        (unknown slug, sharing disabled, no healthy published release) are
        indistinguishable.
      required: [status, appName, viewMode, frameUrl]
      properties:
        status:
          type: string
          enum: [live, unavailable]
        appName:
          type: [string, "null"]
          maxLength: 120
        viewMode:
          oneOf:
            - type: string
              enum: [frame, redirect]
            - type: "null"
        frameUrl:
          type: [string, "null"]
          maxLength: 2048
    VenomSopLifecycle:
      type: string
      enum: [draft, active, archived]
    VenomSopCategory:
      type: string
      enum: [operations, brand, customer_service]
    VenomSopProvenance:
      type: string
      enum: [manual, imported, model_assisted]
    SharedWorkspaceRole:
      type: string
      enum: [admin, member]
    SharedWorkspace:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string, minLength: 1, maxLength: 80 }
        role: { $ref: "#/components/schemas/SharedWorkspaceRole" }
        memberCount: { type: number, multipleOf: 1, minimum: 1 }
        createdAt: { type: string, format: date-time }
      required: [id, name, role, memberCount, createdAt]
    SharedWorkspaceCreateInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
      required: [name]
    SharedWorkspaceMember:
      type: object
      additionalProperties: false
      properties:
        userId: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/SharedWorkspaceRole" }
        name: { type: [string, "null"], maxLength: 200 }
        addedAt: { type: string, format: date-time }
      required: [userId, role, name, addedAt]
    SharedWorkspaceMemberInput:
      type: object
      additionalProperties: false
      properties:
        userId: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/SharedWorkspaceRole" }
      required: [userId]
    SharedWorkspaceMemberRoleInput:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/SharedWorkspaceRole" }
      required: [role]
    SharedWorkspaceAccessError:
      type: object
      additionalProperties: false
      properties:
        error: { type: string }
        code:
          type: string
          # `workspace_access_denied` means the caller is not a member (or the
          # workspace does not exist) — clients evict every cached read for the
          # workspace. `workspace_admin_required` means the caller IS a member
          # but lacks the admin role; clients must NOT treat it as access loss,
          # so a demotion never feels like being kicked out.
          enum: [workspace_access_denied, workspace_admin_required]
      required: [error, code]
    SharedWorkspaceKnowledge:
      type: object
      additionalProperties: false
      properties:
        clusters:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/VenomKnowledgeCluster" }
      required: [clusters]
    SharedWorkspaceSop:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        title: { type: string, minLength: 1, maxLength: 160 }
        lifecycle: { $ref: "#/components/schemas/VenomSopLifecycle" }
        category: { $ref: "#/components/schemas/VenomSopCategory" }
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        provenance: { $ref: "#/components/schemas/VenomSopProvenance" }
        content: { $ref: "#/components/schemas/VenomSopContent" }
        activeRevisionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        activeRevisionNumber:
          type: [number, "null"]
          multipleOf: 1
          minimum: 1
        sensitive:
          description: >-
            Sensitivity lock. Any member may set or clear it; locked SOPs
            stay visible inside the workspace but are withheld from exports
            when the workspace's export policy forbids sensitive content
            leaving.
          type: boolean
        adminOnly:
          description: >-
            Admin-only restriction. Set only by workspace admins through the
            restriction endpoint. Restricted SOPs are filtered out of member
            reads, member chat context, and member exports server-side, so a
            non-admin response never carries one — when this flag is true,
            the reader is an admin.
          type: boolean
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, lifecycle, category, tags, provenance, content, activeRevisionId, activeRevisionNumber, createdAt, updatedAt]
    SharedWorkspaceSettings:
      type: object
      additionalProperties: false
      properties:
        allowSensitiveExport:
          description: >-
            Export policy. True (the default) lets exports include items
            marked sensitive; false makes the server exclude them from every
            export and state how many were withheld.
          type: boolean
      required: [allowSensitiveExport]
    SensitivityUpdateInput:
      type: object
      additionalProperties: false
      properties:
        sensitive: { type: boolean }
      required: [sensitive]
    RestrictionUpdateInput:
      type: object
      additionalProperties: false
      properties:
        adminOnly: { type: boolean }
      required: [adminOnly]
    VenomSopContent:
      type: object
      additionalProperties: false
      properties:
        purpose: { type: string, minLength: 1, maxLength: 2000 }
        prerequisites:
          type: array
          maxItems: 25
          items: { type: string, minLength: 1, maxLength: 500 }
        inputs:
          type: array
          maxItems: 25
          items: { type: string, minLength: 1, maxLength: 500 }
        guidance:
          type: array
          minItems: 1
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 2000 }
        requiredApprovals:
          type: array
          maxItems: 25
          items: { type: string, minLength: 1, maxLength: 500 }
        acceptanceChecks:
          type: array
          maxItems: 25
          items: { type: string, minLength: 1, maxLength: 500 }
      required: [purpose, prerequisites, inputs, guidance, requiredApprovals, acceptanceChecks]
    VenomSop:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        title: { type: string, minLength: 1, maxLength: 160 }
        lifecycle: { $ref: "#/components/schemas/VenomSopLifecycle" }
        category: { $ref: "#/components/schemas/VenomSopCategory" }
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        provenance: { $ref: "#/components/schemas/VenomSopProvenance" }
        content: { $ref: "#/components/schemas/VenomSopContent" }
        activeRevisionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        activeRevisionNumber:
          type: [number, "null"]
          multipleOf: 1
          minimum: 1
        appIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
      required: [id, title, lifecycle, category, tags, provenance, content, activeRevisionId, activeRevisionNumber, appIds, createdAt, updatedAt, archivedAt]
    VenomSopInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        category: { $ref: "#/components/schemas/VenomSopCategory" }
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        provenance: { $ref: "#/components/schemas/VenomSopProvenance" }
        content: { $ref: "#/components/schemas/VenomSopContent" }
      required: [title, category, tags, provenance, content]
    VenomSopUpdate:
      allOf:
        - $ref: "#/components/schemas/VenomSopInput"
    VenomSopRevision:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        versionNumber: { type: number, multipleOf: 1, minimum: 1 }
        provenance: { $ref: "#/components/schemas/VenomSopProvenance" }
        checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        title: { type: string, minLength: 1, maxLength: 160 }
        category: { $ref: "#/components/schemas/VenomSopCategory" }
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
        content: { $ref: "#/components/schemas/VenomSopContent" }
        publishedAt: { type: string, format: date-time }
      required: [id, versionNumber, provenance, checksumSha256, title, category, tags, content, publishedAt]
    VenomSopAppAssignment:
      type: object
      additionalProperties: false
      properties:
        appId: { $ref: "#/components/schemas/Uuid" }
        assignedAt: { type: string, format: date-time }
      required: [appId, assignedAt]
    VenomSopAppAssignmentsInput:
      type: object
      additionalProperties: false
      properties:
        appIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
      required: [appIds]
    VenomSopDetail:
      type: object
      additionalProperties: false
      properties:
        sop: { $ref: "#/components/schemas/VenomSop" }
        revisions:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/VenomSopRevision" }
        assignments:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/VenomSopAppAssignment" }
      required: [sop, revisions, assignments]
    VenomSopProjectSelection:
