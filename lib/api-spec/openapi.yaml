openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: venom
    description: Venom AI assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /venom/respond:
    post:
      operationId: sendVenomMessage
      tags: [venom]
      summary: Stream a response from the Venom assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomChatRequest"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "401":
          description: Authentication required
        "403":
          description: The caller requested a shared workspace they are not currently a member of
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "429":
          description: Per-account managed chat limit reached
        "502":
          description: Selected managed provider is unavailable
  /venom/models:
    get:
      operationId: getVenomModels
      tags: [venom]
      summary: List the server-managed text models available to Venom
      responses:
        "200":
          description: Sanitized managed model catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenomManagedModel"
        "401":
          description: Authentication required
  /venom/deliberation:
    get:
      operationId: getVenomDeliberation
      tags: [venom]
      summary: Describe multi-voice deliberation availability and its voice roster
      responses:
        "200":
          description: Deliberation availability and the neutral voice roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomDeliberationAvailability"
        "401":
          description: Authentication required
  /venom/files/uploads:
    post:
      operationId: createVenomChatFileUpload
      tags: [venom]
      summary: Start a chat file upload and get a one-time signed upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomChatFileUploadRequest"
      responses:
        "200":
          description: Pending file record plus the signed PUT URL for the bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomChatFileUploadTicket"
        "400":
          description: Unsupported file type or size
        "401":
          description: Authentication required
        "429":
          description: Too many upload requests
  /venom/files/uploads/{fileId}/complete:
    post:
      operationId: completeVenomChatFileUpload
      tags: [venom]
      summary: Verify an uploaded chat file and extract its text for context
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9-]{1,64}$"
      responses:
        "200":
          description: The verified, ready file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomChatFile"
        "400":
          description: The uploaded bytes failed verification (missing or oversized)
        "401":
          description: Authentication required
        "404":
          description: No pending upload with this id belongs to the caller
  /venom/files/{fileId}:
    get:
      operationId: downloadVenomChatFile
      tags: [venom]
      summary: Download a chat file the caller owns
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9-]{1,64}$"
      responses:
        "200":
          description: The file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: No ready file with this id belongs to the caller
  /venom/voice/catalog:
    get:
      operationId: getVenomVoices
      tags: [venom]
      summary: List the named voice presets for hands-free voice chat
      responses:
        "200":
          description: Named voice presets mapped to server-managed voices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenomVoicePreset"
        "401":
          description: Authentication required
  /venom/voice/transcribe:
    post:
      operationId: transcribeVenomVoice
      tags: [venom]
      summary: Transcribe one spoken utterance to text
      description: >-
        Audio is processed transiently in memory and never persisted or
        logged; only the recognized text is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomVoiceTranscriptionRequest"
      responses:
        "200":
          description: The recognized text of the utterance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomVoiceTranscription"
        "400":
          description: Invalid transcription request
        "401":
          description: Authentication required
        "429":
          description: Too many transcription requests
        "503":
          description: Voice is unavailable because the OpenAI audio integration is not configured
  /venom/voice/speak:
    post:
      operationId: speakVenomVoice
      tags: [venom]
      summary: Stream spoken audio for a piece of assistant text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomVoiceSpeechRequest"
      responses:
        "200":
          description: SSE stream of base64 PCM16 audio chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid speech request
        "401":
          description: Authentication required
        "429":
          description: Too many speech requests
        "503":
          description: Voice is unavailable because the OpenAI audio integration is not configured
  /venom/voice/decide:
    post:
      operationId: decideVenomVoiceTurn
      tags: [venom]
      summary: Decide whether a finished spoken turn deserves a reply, a brief acknowledgment, or silence
      description: >-
        Classifies one finished voice turn from its transcript and recent
        conversation momentum. Hard-biased toward responding: questions and
        direct requests always get a full reply, and any uncertainty or
        internal failure resolves to "respond". Applies only to voice mode;
        typed chat never consults this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomVoiceTurnDecisionRequest"
      responses:
        "200":
          description: The restraint decision for this turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomVoiceTurnDecision"
        "400":
          description: Invalid decision request
        "401":
          description: Authentication required
        "429":
          description: Too many decision requests
  /venom/voice/decision-outcome:
    post:
      operationId: reportVenomVoiceDecisionOutcome
      tags: [venom]
      summary: Record what actually happened after a speak/stay-quiet decision
      description: >-
        Pairs a prior decision with its observed outcome (reply interrupted,
        user re-asked after silence, session wound down cleanly, ...) so
        restraint thresholds can be tuned from real usage. No audio is ever
        attached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomVoiceDecisionOutcomeRequest"
      responses:
        "200":
          description: Whether the outcome was recorded against a known decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomVoiceDecisionOutcomeResult"
        "400":
          description: Invalid outcome report
        "401":
          description: Authentication required
        "429":
          description: Too many outcome reports
  /venom/voice/decisions/summary:
    get:
      operationId: getVenomVoiceDecisionSummary
      tags: [venom]
      summary: Aggregate your speak/stay-quiet decisions against their observed outcomes
      description: >-
        Evidence view over the signed-in account's own logged voice restraint
        decisions: counts for every observed talkativeness x decision x
        outcome combination in the window, plus the headline rates the
        restraint thresholds are tuned from — how often silence was followed
        by a re-ask, how often spoken replies were interrupted, how often
        goodbyes wound down cleanly. The heuristic thresholds in force are
        echoed so the numbers can be read against them; interpretation notes
        live in artifacts/api-server/src/lib/venom-voice-restraint-tuning.md.
      parameters:
        - name: windowDays
          in: query
          required: false
          description: >-
            How many days back to aggregate. Bounded by the 90-day retention
            cap; defaults to 30.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Aggregated decision/outcome evidence for the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomVoiceDecisionSummary"
        "400":
          description: Invalid report request
        "401":
          description: Authentication required
        "429":
          description: Too many report requests
        "500":
          description: The decision log could not be read
  /venom/voice/decisions/export:
    get:
      operationId: exportVenomVoiceDecisions
      tags: [venom]
      summary: Download your logged voice decisions as a JSONL training dataset
      description: >-
        One JSON object per line, oldest first: the context signals each
        decision was derived from, the decision and which layer made it, the
        talkativeness in force, and the observed outcome once reported.
        Contains only what the decision log stores — bounded transcript
        previews and signals, never audio.
      parameters:
        - name: windowDays
          in: query
          required: false
          description: >-
            How many days back to export. Bounded by the 90-day retention
            cap; defaults to 90 (everything retained).
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 90
      responses:
        "200":
          description: >-
            JSONL attachment, one decision record per line. Served as
            text/plain so generated clients return the body string; the
            .jsonl filename travels in Content-Disposition.
          content:
            text/plain:
              schema: { type: string, maxLength: 2000000 }
        "400":
          description: Invalid export request
        "401":
          description: Authentication required
        "429":
          description: Too many export requests
        "500":
          description: The decision log could not be read
  /venom/usage/summary:
    get:
      operationId: getVenomUsageSummary
      tags: [venom]
      summary: Your own AI usage and spend for the current month
      description: >-
        Personal metering view over the signed-in account's recorded AI
        calls: current calendar month (UTC) totals in dollars, a per-day
        trend, and a per-model breakdown under Venom-branded model names.
        Costs are computed server-side from a private pricing table, so
        provider SKUs and raw per-token rates never appear in the payload.
        Calls whose provider omitted exact token counts are folded in as
        flagged character-based estimates, and the audio legs of voice mode
        carry a flat documented per-request estimate.
      responses:
        "200":
          description: The caller's usage summary for the current month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomUsageSummary"
        "401":
          description: Authentication required
        "500":
          description: The usage ledger could not be read
  /venom/knowledge/extract:
    post:
      operationId: extractVenomKnowledge
      tags: [venom]
      summary: Extract knowledge clusters from a project conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeExtractionInput"
      responses:
        "200":
          description: Knowledge clusters found in the conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExtraction"
        "401":
          description: Authentication required
        "429":
          description: Too many extraction requests
  /venom/knowledge/moves:
    get:
      operationId: listVenomKnowledgeMoves
      tags: [venom]
      summary: List your automatic knowledge-move notices and pending suggestions
      description: >-
        Author-scoped ledger of automatic filing decisions: undoable notices
        for knowledge that auto-filed or re-filed into a workspace (or back
        to personal), plus pending personal-to-workspace suggestions that
        wait for explicit consent.
      responses:
        "200":
          description: The caller's notices and pending suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomKnowledgeMoves"
        "401":
          description: Authentication required
  /venom/knowledge/moves/{moveId}/undo:
    post:
      operationId: undoVenomKnowledgeMove
      tags: [venom]
      summary: Undo an automatic knowledge filing or re-file
      description: >-
        Reverses the recorded move: workspace stores return to their prior
        state and the affected clusters land in the author's private
        Unsorted area (for auto-filings) or their original store (for
        re-files). Needs no live membership, so it keeps working after
        leaving the workspace.
      parameters:
        - name: moveId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: The move was reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomKnowledgeMoveUndo"
        "401":
          description: Authentication required
        "404":
          description: No such move for this account
        "409":
          description: The move was already undone
  /venom/knowledge/moves/{moveId}/accept:
    post:
      operationId: acceptVenomKnowledgeSuggestion
      tags: [venom]
      summary: Accept a personal-to-workspace sharing suggestion
      description: >-
        The consent step that widens visibility: moves the suggested
        personal concept into the workspace's shared Brain. Membership is
        re-checked at this moment, never assumed from the suggestion.
      parameters:
        - name: moveId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: The concept now lives in the workspace's Brain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomKnowledgeMoveResult"
        "401":
          description: Authentication required
        "403":
          description: The caller is not currently a member of that workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404":
          description: No such pending suggestion (or its concept is gone)
        "409":
          description: The suggestion was already resolved
  /venom/knowledge/moves/{moveId}/dismiss:
    post:
      operationId: dismissVenomKnowledgeSuggestion
      tags: [venom]
      summary: Dismiss a personal-to-workspace sharing suggestion
      parameters:
        - name: moveId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: The suggestion will not be offered again soon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomKnowledgeSuggestionDismissal"
        "401":
          description: Authentication required
        "404":
          description: No such pending suggestion for this account
        "409":
          description: The suggestion was already resolved
  /venom/knowledge/unsorted/{conceptId}/move:
    post:
      operationId: moveVenomUnsortedConcept
      tags: [venom]
      summary: File an Unsorted concept into a workspace Brain
      description: >-
        Explicit filing from the Unsorted review. Only concepts currently in
        the author's Unsorted holding area qualify; membership in the target
        workspace is re-checked here.
      parameters:
        - name: conceptId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenomUnsortedMoveInput"
      responses:
        "200":
          description: The concept now lives in the workspace's Brain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomKnowledgeMoveResult"
        "401":
          description: Authentication required
        "403":
          description: The caller is not currently a member of that workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedWorkspaceAccessError" }
        "404":
          description: No such concept in the caller's personal Brain
        "409":
          description: The concept is not in the Unsorted holding area
  /venom/ontology/search:
    get:
      operationId: searchVenomOntology
      tags: [venom]
      summary: Search the signed-in user's knowledge ontology across projects
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: org
          in: query
          required: false
          description: >-
            Company id. When present, searches that company's shared Brain
            instead of the personal ontology; the caller must be a member.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Concepts matching the query, best matches first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOntologySearchResponse"
        "400":
          description: Invalid search query
        "401":
          description: Authentication required
  /venom/ontology/concepts/{conceptId}:
    get:
      operationId: getVenomOntologyConcept
      tags: [venom]
      summary: Get one ontology concept with its neighbors and evidence
      parameters:
        - name: conceptId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: org
          in: query
          required: false
          description: >-
            Company id. When present, resolves the concept inside that
            company's shared Brain; the caller must be a member.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: The concept, its linked neighbors, and its evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOntologyConceptDetail"
        "401":
          description: Authentication required
        "404":
          description: Concept not found
  /venom/conversations/{conversationId}:
    get:
      operationId: getVenomConversation
      tags: [venom]
      summary: Read one conversation from the synced workspace snapshot
      description: >-
        Serves a cited conversation for read-only viewing on a device that
        does not hold it locally. Brain evidence on a server-side concept can
        reference conversations that only exist in the cloud snapshot; this
        lookup completes that trail of proof. Owner-scoped - it only ever
        reads the signed-in user's own snapshot.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: The conversation as last synced, labeled with its project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomRemoteConversation"
        "401":
          description: Authentication required
        "404":
          description: No synced conversation with this id
  /venom/identity:
    get:
      operationId: getVenomIdentity
      tags: [venom]
      summary: Who Venom recognizes the signed-in account as
      description: >-
        Resolves the signed-in account into its per-user identity record
        (display name, email, sign-in provider), creating the record on
        first authenticated use and refreshing it when stale.
      responses:
        "200":
          description: The recognized identity for the signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomIdentity"
        "401":
          description: Authentication required
  /venom/canon/teachings:
    get:
      operationId: listVenomCanonTeachings
      tags: [venom]
      summary: List every canon teaching (super admins only)
      description: >-
        The full curated canon, active and retired, with provenance. Callers
        without the super admin role receive the opaque canon access error
        regardless of whether any teachings exist.
      responses:
        "200":
          description: All canon teachings, newest first
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: "#/components/schemas/VenomCanonTeaching" }
        "401": { description: Authentication required }
        "403":
          description: The caller is not a super admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonAccessError" }
    post:
      operationId: commitVenomCanonTeaching
      tags: [venom]
      summary: Commit a confirmed teaching into the canon (super admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitVenomCanonTeachingInput" }
      responses:
        "201":
          description: The teaching now in canon, with Venom's acknowledgment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonCommitResult" }
        "400": { description: The draft could not be normalized into a teaching }
        "401": { description: Authentication required }
        "403":
          description: The caller is not a super admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonAccessError" }
        "409": { description: The canon is at capacity }
  /venom/canon/teachings/{teachingId}:
    patch:
      operationId: updateVenomCanonTeaching
      tags: [venom]
      summary: Edit or retire/restore a canon teaching (super admins only)
      parameters:
        - name: teachingId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 60 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVenomCanonTeachingInput" }
      responses:
        "200":
          description: The teaching after the update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonTeaching" }
        "400": { description: No usable fields in the update }
        "401": { description: Authentication required }
        "403":
          description: The caller is not a super admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonAccessError" }
        "404": { description: No teaching with this id }
  /venom/canon/propose:
    post:
      operationId: proposeVenomCanonTeaching
      tags: [venom]
      summary: Distill a chat message into a draft teaching (super admins only)
      description: >-
        Detects teach intent in a super admin's chat message and distills it
        into a draft teaching for confirmation. Ambiguous or non-teaching
        messages return teachIntent=false so the client falls back to an
        ordinary chat turn. Nothing is stored until the draft is committed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeVenomCanonTeachingInput" }
      responses:
        "200":
          description: The distilled draft, or a no-intent verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposeVenomCanonTeachingResult" }
        "400": { description: Invalid proposal request }
        "401": { description: Authentication required }
        "403":
          description: The caller is not a super admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonAccessError" }
        "429": { description: Too many proposal requests }
  /venom/canon/admins:
    get:
      operationId: listVenomCanonAdmins
      tags: [venom]
      summary: List super admins (super admins only)
      responses:
        "200":
          description: Current super admins
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/VenomCanonAdmin" }
        "401": { description: Authentication required }
        "403":
          description: The caller is not a super admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonAccessError" }
    post:
      operationId: grantVenomCanonAdmin
      tags: [venom]
      summary: Grant the super admin role to another account (super admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantVenomCanonAdminInput" }
      responses:
        "201":
          description: The account now holds the super admin role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonAdmin" }
        "400": { description: No account with this id }
        "401": { description: Authentication required }
        "403":
          description: The caller is not a super admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonAccessError" }
        "409": { description: Already a super admin }
  /venom/canon/admins/{adminUserId}:
    delete:
      operationId: revokeVenomCanonAdmin
      tags: [venom]
      summary: Revoke another account's super admin role (super admins only)
      description: >-
        Self-revocation is refused, and the last remaining super admin can
        never be removed, so the canon always keeps at least one steward.
      parameters:
        - name: adminUserId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "204": { description: Role revoked }
        "400": { description: You cannot revoke your own role }
        "401": { description: Authentication required }
        "403":
          description: The caller is not a super admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomCanonAccessError" }
        "404": { description: That account is not a super admin }
        "409": { description: The last super admin cannot be removed }
  /venom/orgs:
