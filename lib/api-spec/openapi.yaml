          maxItems: 10000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        clusters:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        stages:
          type: array
          maxItems: 15000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        fields:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
        sources:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/VenomDeletionMarker"
      required: [projects, tasks, conversations, messages, clusters, stages, fields, sources]
