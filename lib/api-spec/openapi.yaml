      responses:
        "200":
          description: Active SOP references for a project
          content:
            application/json:
              schema:
                type: array
                maxItems: 30
                items: { $ref: "#/components/schemas/VenomSopProjectSelection" }
        "401": { description: Authentication required }
        "404": { description: Project not found }
    put:
      operationId: selectVenomProjectSops
      tags: [venom]
      summary: Select active SOP revisions for a workspace project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomProjectSopSelectionInput" }
      responses:
        "200":
          description: Updated project SOP selections
          content:
            application/json:
              schema:
                type: array
                maxItems: 30
                items: { $ref: "#/components/schemas/VenomSopProjectSelection" }
        "400": { description: Invalid SOP selection }
        "401": { description: Authentication required }
        "404": { description: Project or SOP not found }
  /venom/community/profile:
    get:
      operationId: getCommunityProfile
      tags: [venom-community]
      summary: Get the signed-in user's public community profile
      responses:
        "200":
          description: Public community profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPublicProfile"
        "401":
          description: Authentication required
        "404":
          description: Profile not yet created
    put:
      operationId: upsertCommunityProfile
      tags: [venom-community]
      summary: Create or update the signed-in user's public community profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityProfileInput"
      responses:
        "200":
          description: Updated community profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPublicProfile"
        "400":
          description: Invalid profile data
        "401":
          description: Authentication required
  /venom/community/feed:
    get:
      operationId: getCommunityFeed
      tags: [venom-community]
      summary: Get a cursor page of community threads
      parameters:
        - name: order
          in: query
          required: true
          schema:
            type: string
            enum: [new, top]
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 240
        - name: limit
          in: query
          required: false
          schema:
            type: number
            multipleOf: 1
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Cursor page of community threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityFeedPage"
        "400":
          description: Invalid query parameters
        "401":
          description: Authentication required
  /venom/community/briefing:
    get:
      operationId: getCommunityBriefing
      tags: [venom-community]
      summary: Get the community briefing with personal agenda and calendar status
      parameters:
        - name: timezone
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [new, top]
            default: new
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 240
        - name: limit
          in: query
          required: false
          schema:
            type: number
            multipleOf: 1
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Community briefing page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityBriefingPage"
        "400":
          description: Invalid query parameters
        "401":
          description: Authentication required
  /venom/community/threads:
    post:
      operationId: createCommunityThread
      tags: [venom-community]
      summary: Create a new community thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityThreadInput"
      responses:
        "201":
          description: Created community thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityThread"
        "400":
          description: Invalid thread data
        "401":
          description: Authentication required
        "409":
          description: Community profile required before posting
  /venom/community/threads/{threadId}:
    get:
      operationId: getCommunityThread
      tags: [venom-community]
      summary: Get a community thread with its replies
      parameters:
        - $ref: "#/components/parameters/CommunityThreadId"
        - name: replyId
          in: query
          required: false
          description: Include this specific reply even when it falls outside the normal reply window
          schema:
            type: string
            pattern: "^[0-9a-fA-F-]{36}$"
      responses:
        "200":
          description: Thread detail with replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityThreadDetail"
        "400":
          description: Invalid reply focus
        "401":
          description: Authentication required
        "404":
          description: Thread not found
    patch:
      operationId: updateCommunityThread
      tags: [venom-community]
      summary: Update a community thread (owner only)
      parameters:
        - $ref: "#/components/parameters/CommunityThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityThreadUpdate"
      responses:
        "200":
          description: Updated community thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityThread"
        "400":
          description: Invalid thread data
        "401":
          description: Authentication required
        "403":
          description: Not the thread owner
        "404":
          description: Thread not found
    delete:
      operationId: deleteCommunityThread
      tags: [venom-community]
      summary: Delete a community thread (owner only)
      parameters:
        - $ref: "#/components/parameters/CommunityThreadId"
      responses:
        "204":
          description: Thread deleted
        "401":
          description: Authentication required
        "403":
          description: Not the thread owner
        "404":
          description: Thread not found
  /venom/community/threads/{threadId}/replies:
    post:
      operationId: createCommunityReply
      tags: [venom-community]
      summary: Post a reply to a community thread
      parameters:
        - $ref: "#/components/parameters/CommunityThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReplyInput"
      responses:
        "201":
          description: Created reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReply"
        "400":
          description: Invalid reply data
        "401":
          description: Authentication required
        "404":
          description: Thread not found
        "409":
          description: Community profile required or client request id already used
  /venom/community/replies/{replyId}:
    patch:
      operationId: updateCommunityReply
      tags: [venom-community]
      summary: Update a community reply (owner only)
      parameters:
        - $ref: "#/components/parameters/CommunityReplyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReplyUpdate"
      responses:
        "200":
          description: Updated reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReply"
        "400":
          description: Invalid reply data
        "401":
          description: Authentication required
        "403":
          description: Not the reply owner
        "404":
          description: Reply not found
    delete:
      operationId: deleteCommunityReply
      tags: [venom-community]
      summary: Delete a community reply (owner only)
      parameters:
        - $ref: "#/components/parameters/CommunityReplyId"
      responses:
        "204":
          description: Reply deleted
        "401":
          description: Authentication required
        "403":
          description: Not the reply owner
        "404":
          description: Reply not found
  /venom/community/threads/{threadId}/vote:
    put:
      operationId: voteCommunityThread
      tags: [venom-community]
      summary: Set the viewer's upvote state on a thread (idempotent)
      parameters:
        - $ref: "#/components/parameters/CommunityThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityVoteInput"
      responses:
        "200":
          description: Current vote state after applying the desired state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityVoteResult"
        "401":
          description: Authentication required
        "404":
          description: Thread not found
  /venom/community/reports:
    post:
      operationId: createCommunityReport
      tags: [venom-community]
      summary: Submit a content report for a thread or reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "201":
          description: Report received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportReceipt"
        "400":
          description: Invalid report data
        "401":
          description: Authentication required
        "404":
          description: Target not found
  /venom/community/notifications:
    get:
      operationId: listCommunityNotifications
      tags: [venom-community]
      summary: List the signed-in user's community notifications (cursor paginated)
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 240
        - name: limit
          in: query
          required: false
          schema:
            type: number
            multipleOf: 1
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Cursor page of community notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityNotificationPage"
        "400":
          description: Invalid query parameters
        "401":
          description: Authentication required
  /venom/community/notifications/unread-count:
    get:
      operationId: getCommunityNotificationUnreadCount
      tags: [venom-community]
      summary: Get the signed-in user's unread community notification count
      responses:
        "200":
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityNotificationUnreadCount"
        "401":
          description: Authentication required
  /venom/community/notifications/read-all:
    post:
      operationId: markAllCommunityNotificationsRead
      tags: [venom-community]
      summary: Mark all of the signed-in user's community notifications as read
      responses:
        "200":
          description: Number of notifications marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityNotificationMarkAllResult"
        "401":
          description: Authentication required
  /venom/community/notifications/{notificationId}/read:
    post:
      operationId: markCommunityNotificationRead
      tags: [venom-community]
      summary: Mark a single community notification as read (idempotent)
      parameters:
        - $ref: "#/components/parameters/CommunityNotificationId"
      responses:
        "200":
          description: The notification after marking it read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityNotification"
        "401":
          description: Authentication required
        "404":
          description: Notification not found
  /venom/sources/sync-alerts:
    get:
      operationId: listVenomSourceSyncAlerts
      tags: [venom]
      summary: List active scheduled source sync alerts for the signed-in user
      responses:
        "200":
          description: Sources whose scheduled server-side syncs keep failing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomSourceSyncAlertList"
        "401":
          description: Authentication required
  /venom/sources/sync-alerts/read-all:
    post:
      operationId: markAllVenomSourceSyncAlertsRead
      tags: [venom]
      summary: Mark all of the signed-in user's source sync alerts as read
      responses:
        "200":
          description: Number of alerts marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomSourceSyncAlertMarkAllResult"
        "401":
          description: Authentication required
  /venom/build-templates:
    get:
      operationId: listVenomBuildTemplates
      tags: [venom]
      summary: Browse the global catalog of curated build templates
      responses:
        "200":
          description: Active global templates, gallery ordering
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/VenomBuildTemplateSummary" }
        "401": { description: Authentication required }
  /venom/build-templates/{templateId}:
    get:
      operationId: getVenomBuildTemplate
      tags: [venom]
      summary: Inspect one template, including its pre-filled build inputs
      parameters:
        - $ref: "#/components/parameters/BuildTemplateId"
      responses:
        "200":
          description: Template detail with prefill fields and optional example package
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildTemplate" }
        "401": { description: Authentication required }
        "404": { description: Template not found }
  /venom/build-templates/{templateId}/use:
    post:
      operationId: useVenomBuildTemplate
      tags: [venom]
      summary: Create a portfolio app from this template plus a pre-filled build run request
      parameters:
        - $ref: "#/components/parameters/BuildTemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomBuildTemplateUseInput" }
      responses:
        "201":
          description: App created with template lineage; prefill for the build form
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildTemplateUseResult" }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "404": { description: Template not found }
  /venom/build-templates/by-slug/{slug}:
    put:
      operationId: upsertVenomBuildTemplate
      tags: [venom]
      summary: Create or update a global template (super admins only)
      parameters:
        - $ref: "#/components/parameters/BuildTemplateSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomBuildTemplateUpsert" }
      responses:
        "200":
          description: Upserted template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildTemplate" }
        "400": { description: Invalid template }
        "401": { description: Authentication required }
        "403": { description: Access denied }
  /venom/build-runs:
    get:
      operationId: listVenomBuildRuns
      tags: [venom]
      summary: List durable product-package generation runs
      parameters:
        - name: appId
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/Uuid"
              - type: "null"
      responses:
        "200":
          description: Account-owned generation runs
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/VenomBuildRunSummary" }
        "401": { description: Authentication required }
    post:
      operationId: createVenomBuildRun
      tags: [venom]
      summary: Queue a review-required product package generation run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomBuildRunInput" }
      responses:
        "201":
          description: Durable run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildRun" }
        "400": { description: Invalid generation request or references }
        "401": { description: Authentication required }
        "409": { description: Idempotency key conflict or concurrency limit reached }
  /venom/build-runs/{buildRunId}:
    get:
      operationId: getVenomBuildRun
      tags: [venom]
      summary: Inspect a generation run, package revisions, and activity
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
      responses:
        "200":
          description: Account-owned generation run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildRun" }
        "401": { description: Authentication required }
        "404": { description: Generation run not found }
  /venom/build-runs/{buildRunId}/cancel:
    post:
      operationId: cancelVenomBuildRun
      tags: [venom]
      summary: Cancel a queued or preparing generation run
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomBuildCancellationInput" }
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildRun" }
        "401": { description: Authentication required }
        "404": { description: Generation run not found }
        "409": { description: Run cannot be cancelled from its current state }
  /venom/build-runs/{buildRunId}/retry:
    post:
      operationId: retryVenomBuildRun
      tags: [venom]
      summary: Safely retry a failed or cancelled generation run
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
      responses:
        "202":
          description: Run queued for another attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildRun" }
        "401": { description: Authentication required }
        "404": { description: Generation run not found }
        "409": { description: Run cannot be retried from its current state }
  /venom/build-runs/{buildRunId}/revise:
    post:
      operationId: reviseVenomBuildRun
      tags: [venom]
      summary: Queue an immutable package revision for human review
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomBuildRevisionInput" }
      responses:
        "202":
          description: Revision queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildRun" }
        "400": { description: Invalid revision request }
        "401": { description: Authentication required }
        "404": { description: Generation run not found }
        "409": { description: Run is not reviewable or is already approved }
  /venom/build-runs/{buildRunId}/approve:
    post:
      operationId: approveVenomBuildRun
      tags: [venom]
      summary: Approve one immutable revision for later provisioning
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomBuildApprovalInput" }
      responses:
        "200":
          description: Package approved and ready for provisioning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildRun" }
        "400": { description: Invalid approval request }
        "401": { description: Authentication required }
        "404": { description: Generation run or revision not found }
        "409": { description: Run is not awaiting review }
  /venom/build-runs/{buildRunId}/reject:
    post:
      operationId: rejectVenomBuildRun
      tags: [venom]
      summary: Reject a review-required package without executing it
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenomBuildRejectionInput" }
      responses:
        "200":
          description: Package rejected and run cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildRun" }
        "401": { description: Authentication required }
        "404": { description: Generation run not found }
        "409": { description: Run is not awaiting review }
  /venom/build-runs/{buildRunId}/export/{format}:
    get:
      operationId: exportVenomBuildRun
      tags: [venom]
      summary: Export the latest package revision as JSON or Markdown
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
        - $ref: "#/components/parameters/BuildExportFormat"
      responses:
        "200":
          description: Portable package export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenomBuildPackage" }
            text/markdown:
              schema: { type: string, maxLength: 100000 }
        "400": { description: Invalid export format }
        "401": { description: Authentication required }
        "404": { description: Generation run or revision not found }
  /venom/provisioning/capability:
    get:
      operationId: getProvisioningCapability
      tags: [venom]
      summary: Report provisioning provider capability and permission summary
      responses:
        "200":
          description: Capability summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningCapability" }
        "401": { description: Authentication required }
  /venom/build-runs/{buildRunId}/provision:
    post:
      operationId: provisionBuildRun
      tags: [venom]
      summary: Provision an approved immutable revision into a candidate
      parameters:
        - $ref: "#/components/parameters/BuildRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionBuildRunInput" }
      responses:
        "201":
          description: Provisioning run created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid provisioning request }
        "401": { description: Authentication required }
        "404": { description: Generation run not found }
        "409": { description: Idempotency key already in use }
  /venom/provisioning/runs:
    get:
      operationId: listProvisioningRuns
      tags: [venom]
      summary: List provisioning runs for the current user
      parameters:
        - name: buildRunId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: appId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Provisioning runs
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: "#/components/schemas/ProvisioningRunSummary" }
        "400": { description: Invalid query }
        "401": { description: Authentication required }
  /venom/provisioning/runs/{provisioningRunId}:
    get:
      operationId: getProvisioningRun
      tags: [venom]
      summary: Get one provisioning run with events and releases
      parameters:
        - $ref: "#/components/parameters/ProvisioningRunId"
      responses:
        "200":
          description: Provisioning run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "404": { description: Provisioning run not found }
  /venom/provisioning/runs/{provisioningRunId}/cancel:
    post:
      operationId: cancelProvisioningRun
      tags: [venom]
      summary: Cancel an in-flight provisioning run
      parameters:
        - $ref: "#/components/parameters/ProvisioningRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelProvisioningRunInput" }
      responses:
        "200":
          description: Provisioning run cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid cancellation request }
        "401": { description: Authentication required }
        "404": { description: Provisioning run not found }
        "409": { description: Run cannot be cancelled from its current state }
  /venom/provisioning/runs/{provisioningRunId}/retry:
    post:
      operationId: retryProvisioningRun
      tags: [venom]
      summary: Retry a failed provisioning run
      parameters:
        - $ref: "#/components/parameters/ProvisioningRunId"
      responses:
        "200":
          description: Provisioning run re-queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid retry request }
        "401": { description: Authentication required }
        "404": { description: Provisioning run not found }
        "409": { description: Run is not retryable }
  /venom/provisioning/runs/{provisioningRunId}/publish:
    post:
      operationId: publishProvisioningCandidate
      tags: [venom]
      summary: Publish a healthy candidate release as the primary deployment
      parameters:
        - $ref: "#/components/parameters/ProvisioningRunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishProvisioningCandidateInput" }
      responses:
        "200":
          description: Publish result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningRun" }
        "400": { description: Invalid publish request }
        "401": { description: Authentication required }
        "404": { description: Provisioning run not found }
        "409": { description: Publish conflict }
  /venom/provisioning/releases/{releaseId}/rollback:
    post:
      operationId: rollbackProvisioningRelease
      tags: [venom]
      summary: Roll back to a previous healthy release
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackProvisioningReleaseInput" }
      responses:
        "200":
          description: Rollback result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningCandidateRelease" }
        "400": { description: Invalid rollback request }
        "401": { description: Authentication required }
        "404": { description: Release not found }
        "409": { description: Rollback conflict }
        "500": { description: Rollback failed }
  /public/app-shares/{slug}:
    get:
      operationId: resolvePublicAppShare
      tags: [venom]
      summary: Resolve a public app share link
      description: >-
        Unauthenticated. Resolves a share slug to the currently published,
        healthy release of the shared app. Unknown, disabled, and not-live
        shares all return the same uniform "unavailable" payload so public
        callers cannot distinguish them, and nothing about the owner or the
        underlying deployment provider is ever exposed.
      parameters:
        - $ref: "#/components/parameters/AppShareSlug"
      responses:
        "200":
          description: Public share resolution (uniform for unavailable states)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomPublicAppShare"
        "400":
          description: Malformed slug
        "429":
          description: Too many requests
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    AppShareSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]{10,60}$"
    ImportJobId:
      name: importJobId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    SopId:
      name: sopId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    SharedWorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    CommunityThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    CommunityReplyId:
      name: replyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    CommunityNotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    BuildRunId:
      name: buildRunId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BuildTemplateId:
      name: templateId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BuildTemplateSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
        pattern: "^[a-z0-9][a-z0-9-]*$"
    BuildExportFormat:
      name: format
      in: path
      required: true
      schema:
        type: string
        enum: [json, markdown]
    VenomExportKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [brain, sops]
    WorkspaceConceptId:
      name: conceptId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    WorkspaceConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    ProvisioningRunId:
      name: provisioningRunId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    VenomOrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    VenomOrgInviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    VenomOrgSourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
  schemas:
    VenomAppStatus:
      type: string
      enum: [draft, importing, ready, attention]
    VenomImportStatus:
      type: string
      enum:
        [awaiting_upload, uploading, validating, inspecting, complete, failed]
    VenomApp:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/VenomAppStatus"
        detectedStack:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 60
        sourceType:
          type: string
          enum: [none, zip]
        sourceVersion:
          type: number
          multipleOf: 1
          minimum: 0
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
        importStatus:
          oneOf:
            - $ref: "#/components/schemas/VenomImportStatus"
            - type: "null"
        sourceUpdatedAt:
          type: [string, "null"]
          format: date-time
        linkedProjectId:
          type: [string, "null"]
          maxLength: 120
        linkedProjectName:
          type: [string, "null"]
          maxLength: 120
        latestIterationNumber:
          type: number
          multipleOf: 1
          minimum: 0
        liveReleaseId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        liveIterationNumber:
          oneOf:
            - type: number
              multipleOf: 1
              minimum: 1
            - type: "null"
        livePublishedAt:
          type: [string, "null"]
          format: date-time
        improvementSignal:
          oneOf:
            - $ref: "#/components/schemas/VenomAppImprovementSignal"
            - type: "null"
        templateId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        templateName:
          type: [string, "null"]
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, name, purpose, brand, status, detectedStack, sourceType, sourceVersion, deploymentUrl, importStatus, sourceUpdatedAt, linkedProjectId, linkedProjectName, latestIterationNumber, liveReleaseId, liveIterationNumber, livePublishedAt, improvementSignal, templateId, templateName, createdAt, updatedAt]
    VenomAppInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
      required: [name, purpose, brand]
    VenomAppUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/VenomAppStatus"
        deploymentUrl:
          type: [string, "null"]
          maxLength: 2048
        linkedProjectId:
          type: [string, "null"]
          maxLength: 120
    VenomSourceManifest:
      type: object
      additionalProperties: false
      properties:
        formatVersion:
          type: number
          const: 1
        rootKind:
          type: string
          enum: [single-project, monorepo]
        totalEntries:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 5000
        safeFileCount:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 5000
        excludedSensitiveFileCount:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 5000
        files:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 240
        projectFiles:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 240
        detectedStack:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 60
      required:
        [formatVersion, rootKind, totalEntries, safeFileCount, excludedSensitiveFileCount, files, projectFiles, detectedStack]
    VenomSourceVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        versionNumber:
          type: number
          multipleOf: 1
          minimum: 1
        sourceType:
          type: string
          enum: [zip]
        archiveFilename:
          type: string
          minLength: 1
          maxLength: 160
        archiveBytes:
          type: number
          multipleOf: 1
          minimum: 1
        checksumSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifest:
          $ref: "#/components/schemas/VenomSourceManifest"
        createdAt:
          type: string
          format: date-time
      required:
        [id, versionNumber, sourceType, archiveFilename, archiveBytes, checksumSha256, manifest, createdAt]
    VenomImportJob:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        appId:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        archiveFilename:
          type: string
          minLength: 1
          maxLength: 160
        declaredBytes:
          type: number
          multipleOf: 1
          minimum: 1
        status:
          $ref: "#/components/schemas/VenomImportStatus"
        progress:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 100
        failureCode:
          type: [string, "null"]
          maxLength: 80
        failureMessage:
          type: [string, "null"]
          maxLength: 240
        sourceVersionId:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F-]{36}$"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
      required:
        [id, appId, archiveFilename, declaredBytes, status, progress, failureCode, failureMessage, sourceVersionId, createdAt, updatedAt, completedAt]
    VenomDeploymentLink:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F-]{36}$"
        label:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          maxLength: 2048
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, label, url, isPrimary, createdAt]
    VenomAppDetail:
      type: object
      additionalProperties: false
      properties:
        app:
          $ref: "#/components/schemas/VenomApp"
        versions:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/VenomSourceVersion"
        importJobs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VenomImportJob"
        deploymentLinks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/VenomDeploymentLink"
        provisioningReleases:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ProvisioningCandidateRelease"
        iterations:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/VenomAppIteration"
        timeline:
          type: array
          maxItems: 400
          items:
            $ref: "#/components/schemas/VenomAppTimelineEntry"
        timelineTotal:
          type: number
          multipleOf: 1
          minimum: 0
        timelineTruncated:
          type: boolean
      required: [app, versions, importJobs, deploymentLinks, provisioningReleases, iterations, timeline, timelineTotal, timelineTruncated]
    VenomAppTimelinePage:
      type: object
      additionalProperties: false
      properties:
        entries:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/VenomAppTimelineEntry"
        nextCursor:
          type: [string, "null"]
          maxLength: 300
        total:
          type: number
          multipleOf: 1
          minimum: 0
      required: [entries, nextCursor, total]
    VenomAppImprovementSignal:
      type: object
      additionalProperties: false
      properties:
        since:
          type: string
          format: date-time
        knowledgeChanges:
          type: number
          multipleOf: 1
          minimum: 0
        sourceChanges:
          type: number
          multipleOf: 1
          minimum: 0
        totalChanges:
          type: number
          multipleOf: 1
          minimum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 1500
        baselineIterationNumber:
          type: number
          multipleOf: 1
          minimum: 1
      required: [since, knowledgeChanges, sourceChanges, totalChanges, summary, baselineIterationNumber]
    VenomAppIteration:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        iterationNumber: { type: number, multipleOf: 1, minimum: 1 }
        buildRunId: { $ref: "#/components/schemas/Uuid" }
        revisionId: { $ref: "#/components/schemas/Uuid" }
        packageTitle: { type: string, minLength: 1, maxLength: 160 }
        packageChecksum: { type: string, pattern: "^[a-f0-9]{64}$" }
        runKind: { $ref: "#/components/schemas/VenomBuildRunKind" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        changesSummary: { type: [string, "null"], maxLength: 2000 }
        baselineIterationNumber:
          oneOf:
            - type: number
              multipleOf: 1
              minimum: 1
            - type: "null"
        releaseId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        isLive: { type: boolean }
        createdBy: { type: string, minLength: 1, maxLength: 200 }
        createdAt: { type: string, format: date-time }
      required: [id, iterationNumber, buildRunId, revisionId, packageTitle, packageChecksum, runKind, reason, changesSummary, baselineIterationNumber, releaseId, isLive, createdBy, createdAt]
    VenomAppTimelineEntry:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        kind:
          type: string
          enum: [source_import, package_iteration, release_created, release_published, release_rolled_back]
        occurredAt: { type: string, format: date-time }
        title: { type: string, minLength: 1, maxLength: 240 }
        detail: { type: [string, "null"], maxLength: 2000 }
        actor: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, minLength: 1, maxLength: 60 }
        buildRunId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        releaseId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourceVersionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        iterationNumber:
          oneOf:
            - type: number
              multipleOf: 1
              minimum: 1
            - type: "null"
      required: [id, kind, occurredAt, title, detail, actor, status, buildRunId, releaseId, sourceVersionId, iterationNumber]
    VenomAppIterationBaseline:
      type: object
      additionalProperties: false
      properties:
        iterationId: { $ref: "#/components/schemas/Uuid" }
        iterationNumber: { type: number, multipleOf: 1, minimum: 1 }
        buildRunId: { $ref: "#/components/schemas/Uuid" }
        revisionId: { $ref: "#/components/schemas/Uuid" }
        packageTitle: { type: string, minLength: 1, maxLength: 160 }
        approvedAt: { type: [string, "null"], format: date-time }
        resolvable: { type: boolean }
      required: [iterationId, iterationNumber, buildRunId, revisionId, packageTitle, approvedAt, resolvable]
    VenomAppIterationChanges:
      type: object
      additionalProperties: false
      properties:
        since: { type: string, format: date-time }
        knowledgeChanges: { type: number, multipleOf: 1, minimum: 0 }
        sourceChanges: { type: number, multipleOf: 1, minimum: 0 }
        summary: { type: string, minLength: 1, maxLength: 1500 }
      required: [since, knowledgeChanges, sourceChanges, summary]
    VenomAppLiveRelease:
      type: object
      additionalProperties: false
      properties:
        releaseId: { $ref: "#/components/schemas/Uuid" }
        iterationId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        iterationNumber:
          oneOf:
            - type: number
              multipleOf: 1
              minimum: 1
            - type: "null"
        packageTitle: { type: [string, "null"], maxLength: 160 }
        publishedAt: { type: [string, "null"], format: date-time }
        restoredByRollback: { type: boolean }
        resolvable: { type: boolean }
        baselineSelectable: { type: boolean }
        changes:
          oneOf:
            - $ref: "#/components/schemas/VenomAppIterationChanges"
            - type: "null"
      required:
        [
          releaseId,
          iterationId,
          iterationNumber,
          packageTitle,
          publishedAt,
          restoredByRollback,
          resolvable,
          baselineSelectable,
          changes,
        ]
    VenomAppIterationContext:
      type: object
      additionalProperties: false
      properties:
        appId: { $ref: "#/components/schemas/Uuid" }
        appName: { type: string, minLength: 1, maxLength: 120 }
        linkedProject:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                id: { type: string, minLength: 1, maxLength: 120 }
                name: { type: string, minLength: 1, maxLength: 120 }
              required: [id, name]
            - type: "null"
        baseline:
          oneOf:
            - $ref: "#/components/schemas/VenomAppIterationBaseline"
            - type: "null"
        latestSourceVersion:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                versionNumber: { type: number, multipleOf: 1, minimum: 1 }
                archiveFilename: { type: string, minLength: 1, maxLength: 160 }
              required: [id, versionNumber, archiveFilename]
            - type: "null"
        suggestedSops:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              sopId: { $ref: "#/components/schemas/Uuid" }
              revisionId: { $ref: "#/components/schemas/Uuid" }
              revisionNumber: { type: number, multipleOf: 1, minimum: 1 }
              title: { type: string, minLength: 1, maxLength: 160 }
            required: [sopId, revisionId, revisionNumber, title]
        changes:
          oneOf:
            - $ref: "#/components/schemas/VenomAppIterationChanges"
            - type: "null"
        live:
          oneOf:
            - $ref: "#/components/schemas/VenomAppLiveRelease"
            - type: "null"
        divergence:
          oneOf:
            - type: string
              enum: [in_sync, live_behind, live_ahead, live_unversioned]
            - type: "null"
        canIterate: { type: boolean }
        blockedReason:
          oneOf:
            - type: string
              enum: [no_baseline, baseline_unresolvable]
            - type: "null"
      required: [appId, appName, linkedProject, baseline, latestSourceVersion, suggestedSops, changes, live, divergence, canIterate, blockedReason]
    VenomAppIterationInput:
      type: object
      additionalProperties: false
      properties:
        instruction: { type: string, minLength: 1, maxLength: 4000 }
        constraints: { type: string, maxLength: 4000 }
        sopRevisionIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
        baselineIterationId: { $ref: "#/components/schemas/Uuid" }
      required: [instruction, idempotencyKey]
    VenomImportInput:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^.*\\.[zZ][iI][pP]$"
        size:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 52428800
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
      required: [filename, size, idempotencyKey]
    VenomImportUploadTicket:
      type: object
      additionalProperties: false
      properties:
        job:
          $ref: "#/components/schemas/VenomImportJob"
        uploadUrl:
          type: string
          maxLength: 8192
        maxBytes:
          type: number
          const: 52428800
        requiredContentType:
          type: string
          const: application/zip
      required: [job, uploadUrl, maxBytes, requiredContentType]
    VenomBuildTargetType:
      type: string
      enum: [app, website, brand, customer_service_flow]
    VenomBuildRunStatus:
      type: string
      enum:
        [queued, preparing, review_required, approved, cancelled, failed, ready_for_provisioning]
    VenomBuildRunKind:
      type: string
      enum: [standard, app_iteration]
    VenomBuildRunInput:
      type: object
      additionalProperties: false
      properties:
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        targetName: { type: string, minLength: 1, maxLength: 120 }
        requirements: { type: string, minLength: 1, maxLength: 8000 }
        constraints: { type: string, maxLength: 4000 }
        brandDirection: { type: string, maxLength: 3000 }
        appId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourceVersionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        projectId: { type: [string, "null"], maxLength: 120 }
        sopRevisionIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
        templateId:
          description: >-
            Optional template lineage for runs that started from a global
            template. When the run is pinned to an app that already carries
            template lineage, the app's lineage wins.
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 120
          pattern: "^[A-Za-z0-9_-]+$"
      required:
        [targetType, targetName, requirements, constraints, brandDirection, appId, sourceVersionId, projectId, sopRevisionIds, idempotencyKey]
    VenomBuildRequestSnapshot:
      type: object
      additionalProperties: false
      properties:
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        targetName: { type: string, minLength: 1, maxLength: 120 }
        requirements: { type: string, minLength: 1, maxLength: 8000 }
        constraints: { type: string, maxLength: 4000 }
        brandDirection: { type: string, maxLength: 3000 }
        appId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourceVersionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        projectId: { type: [string, "null"], maxLength: 120 }
        sopRevisionIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
        baselineIterationId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        baselineRevisionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        changesSummary: { type: [string, "null"], maxLength: 2000 }
        templateId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
      required:
        [targetType, targetName, requirements, constraints, brandDirection, appId, sourceVersionId, projectId, sopRevisionIds, baselineIterationId, baselineRevisionId, changesSummary, templateId]
    VenomBuildSourceReference:
      type: object
      additionalProperties: false
      properties:
        appId: { $ref: "#/components/schemas/Uuid" }
        appName: { type: string, minLength: 1, maxLength: 120 }
        sourceVersionId: { $ref: "#/components/schemas/Uuid" }
        versionNumber: { type: number, multipleOf: 1, minimum: 1 }
        checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      required: [appId, appName, sourceVersionId, versionNumber, checksumSha256]
    VenomBuildSopReference:
      type: object
      additionalProperties: false
      properties:
        sopId: { $ref: "#/components/schemas/Uuid" }
        revisionId: { $ref: "#/components/schemas/Uuid" }
        revisionNumber: { type: number, multipleOf: 1, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 160 }
        checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      required: [sopId, revisionId, revisionNumber, title, checksumSha256]
    VenomBuildProductBrief:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string, minLength: 1, maxLength: 3000 }
        audience:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 300 }
        outcomes:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
      required: [summary, audience, outcomes]
    VenomBuildPermissionRequest:
      type: object
      additionalProperties: false
      properties:
        capability: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1, maxLength: 600 }
        required: { type: boolean }
      required: [capability, reason, required]
    VenomBuildPackage:
      type: object
      additionalProperties: false
      properties:
        formatVersion: { type: number, const: 1 }
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        title: { type: string, minLength: 1, maxLength: 160 }
        productBrief: { $ref: "#/components/schemas/VenomBuildProductBrief" }
        functionalScope:
          type: array
          maxItems: 40
          items: { type: string, minLength: 1, maxLength: 800 }
        brandDirection:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        contentRequirements:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        serviceFlowRequirements:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        sourceReferences:
          type: array
          maxItems: 1
          items: { $ref: "#/components/schemas/VenomBuildSourceReference" }
        sopReferences:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/VenomBuildSopReference" }
        dataNeeds:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        integrationNeeds:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
        permissionRequests:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/VenomBuildPermissionRequest" }
        acceptanceChecks:
          type: array
          minItems: 1
          maxItems: 40
          items: { type: string, minLength: 1, maxLength: 800 }
        launchConstraints:
          type: array
          minItems: 1
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 600 }
      required:
        [formatVersion, targetType, title, productBrief, functionalScope, brandDirection, contentRequirements, serviceFlowRequirements, sourceReferences, sopReferences, dataNeeds, integrationNeeds, permissionRequests, acceptanceChecks, launchConstraints]
    VenomBuildPackageRevision:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        revisionNumber: { type: number, multipleOf: 1, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        package: { $ref: "#/components/schemas/VenomBuildPackage" }
        checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
      required:
        [id, revisionNumber, reason, package, checksumSha256, createdAt, approvedAt]
    VenomBuildRunEvent:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        eventType:
          type: string
          enum: [queued, preparing, network_guidance, review_required, revised, approved, ready_for_provisioning, cancelled, rejected, failed, retried]
        status: { $ref: "#/components/schemas/VenomBuildRunStatus" }
        progress: { type: number, multipleOf: 1, minimum: 0, maximum: 100 }
        message: { type: string, minLength: 1, maxLength: 240 }
        createdAt: { type: string, format: date-time }
      required: [id, eventType, status, progress, message, createdAt]
    VenomBuildRunSummary:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        correlationId: { $ref: "#/components/schemas/Uuid" }
        appId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        runKind: { $ref: "#/components/schemas/VenomBuildRunKind" }
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        targetName: { type: string, minLength: 1, maxLength: 120 }
        status: { $ref: "#/components/schemas/VenomBuildRunStatus" }
        progress: { type: number, multipleOf: 1, minimum: 0, maximum: 100 }
        currentRevisionNumber: { type: number, multipleOf: 1, minimum: 0 }
        approvedRevisionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        templateId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        failureMessage: { type: [string, "null"], maxLength: 240 }
        cancelledReason: { type: [string, "null"], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [id, correlationId, appId, runKind, targetType, targetName, status, progress, currentRevisionNumber, approvedRevisionId, templateId, failureMessage, cancelledReason, createdAt, updatedAt]
    VenomBuildRun:
      allOf:
        - $ref: "#/components/schemas/VenomBuildRunSummary"
        - type: object
          additionalProperties: false
          properties:
            request: { $ref: "#/components/schemas/VenomBuildRequestSnapshot" }
            revisions:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/VenomBuildPackageRevision" }
            events:
              type: array
              maxItems: 200
              items: { $ref: "#/components/schemas/VenomBuildRunEvent" }
            attempt: { type: number, multipleOf: 1, minimum: 1, maximum: 10 }
            failureCode: { type: [string, "null"], maxLength: 80 }
            startedAt: { type: [string, "null"], format: date-time }
            completedAt: { type: [string, "null"], format: date-time }
          required:
            [request, revisions, events, attempt, failureCode, startedAt, completedAt]
    VenomBuildTemplateCategory:
      type: string
      enum: [app, widget]
    VenomBuildTemplateStatus:
      type: string
      enum: [active, retired]
    VenomBuildTemplateSummary:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9][a-z0-9-]*$"
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: "#/components/schemas/VenomBuildTemplateCategory" }
        description: { type: string, minLength: 1, maxLength: 1000 }
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        hasExamplePackage: { type: boolean }
        updatedAt: { type: string, format: date-time }
      required:
        [id, slug, name, category, description, targetType, hasExamplePackage, updatedAt]
    VenomBuildTemplate:
      allOf:
        - $ref: "#/components/schemas/VenomBuildTemplateSummary"
        - type: object
          additionalProperties: false
          properties:
            previewSummary: { type: string, maxLength: 2000 }
            targetName: { type: string, minLength: 1, maxLength: 120 }
            requirements: { type: string, minLength: 1, maxLength: 8000 }
            constraints: { type: string, maxLength: 4000 }
            brandDirection: { type: string, maxLength: 3000 }
            acceptanceChecks:
              type: array
              maxItems: 40
              items: { type: string, minLength: 1, maxLength: 800 }
            examplePackage:
              oneOf:
                - $ref: "#/components/schemas/VenomBuildPackage"
                - type: "null"
            status: { $ref: "#/components/schemas/VenomBuildTemplateStatus" }
            networkImprovementCount:
              type: number
              multipleOf: 1
              minimum: 0
              description: >-
                How many concept-level lessons this template has learned from
                the anonymous builder network (opted-in accounts only, each
                lesson seen across several distinct accounts). A plain count —
                never tenant traces.
          required:
            [previewSummary, targetName, requirements, constraints, brandDirection, acceptanceChecks, examplePackage, status, networkImprovementCount]
    VenomBuildTemplatePrefill:
      type: object
      additionalProperties: false
      description: Ready-to-edit build-run form values derived from a template.
      properties:
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        targetName: { type: string, minLength: 1, maxLength: 120 }
        requirements: { type: string, minLength: 1, maxLength: 8000 }
        constraints: { type: string, maxLength: 4000 }
        brandDirection: { type: string, maxLength: 3000 }
      required: [targetType, targetName, requirements, constraints, brandDirection]
    VenomBuildTemplateUseInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional app name override; defaults to the template's target name.
    VenomBuildTemplateUseResult:
      type: object
      additionalProperties: false
      properties:
        app: { $ref: "#/components/schemas/VenomApp" }
        templateId: { $ref: "#/components/schemas/Uuid" }
        templateName: { type: string, minLength: 1, maxLength: 120 }
        prefill: { $ref: "#/components/schemas/VenomBuildTemplatePrefill" }
      required: [app, templateId, templateName, prefill]
    VenomBuildTemplateUpsert:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: "#/components/schemas/VenomBuildTemplateCategory" }
        description: { type: string, minLength: 1, maxLength: 1000 }
        previewSummary: { type: string, maxLength: 2000 }
        targetType: { $ref: "#/components/schemas/VenomBuildTargetType" }
        targetName: { type: string, minLength: 1, maxLength: 120 }
        requirements: { type: string, minLength: 1, maxLength: 8000 }
        constraints: { type: string, maxLength: 4000 }
        brandDirection: { type: string, maxLength: 3000 }
        acceptanceChecks:
          type: array
          maxItems: 40
          items: { type: string, minLength: 1, maxLength: 800 }
        examplePackage:
          oneOf:
            - $ref: "#/components/schemas/VenomBuildPackage"
            - type: "null"
        status: { $ref: "#/components/schemas/VenomBuildTemplateStatus" }
        sortOrder: { type: number, multipleOf: 1, minimum: 0, maximum: 10000 }
      required: [name, category, description, targetType, targetName, requirements]
    VenomBuildCancellationInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
      required: [reason]
    VenomBuildRejectionInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
      required: [reason]
    VenomBuildRevisionInput:
      type: object
      additionalProperties: false
      properties:
        instruction: { type: string, minLength: 1, maxLength: 3000 }
      required: [instruction]
    VenomBuildApprovalInput:
      type: object
      additionalProperties: false
      properties:
        revisionId: { $ref: "#/components/schemas/Uuid" }
      required: [revisionId]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VenomChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        attachmentIds:
          type: array
          maxItems: 5
          uniqueItems: true
          description: >-
            Ids of ready chat files attached to this message. The server
            re-verifies ownership against the file store; unknown or foreign
            ids are ignored rather than rejected.
          items:
            type: string
            pattern: "^[A-Za-z0-9-]{1,64}$"
      required:
        - role
        - content
    VenomChatRequest:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/VenomChatMessage"
        projectContext:
          type: string
          maxLength: 8000
        projectId:
          type: string
          minLength: 1
          maxLength: 160
        modelId:
          $ref: "#/components/schemas/VenomModelId"
        sourceCitationIds:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,160}$"
        sourceSnapshots:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/AttestedSourceSnapshot"
        deliberate:
          type: boolean
          description: Opt this message into multi-voice deliberation.
        mode:
          $ref: "#/components/schemas/VenomResponseMode"
        blend:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/VenomBlendWeight"
          description: >-
            Favoring weights for the participating voices in verify and debate.
            Omitted means an even blend. Weights favor a voice; they never
            silence the others.
        voiceModels:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/VenomVoiceModelPick"
          description: >-
            Explicit per-voice model choices for verify mode: which model plays
            First take, Skeptic, and Evidence. Voices left out keep automatic
            assignment, and a pick naming a model that is currently unusable
            falls back to automatic assignment for that voice. First take and
            Skeptic must land on different LLM providers — a model can't argue
            itself — while Evidence is neutral and may share. Debate corners
            are chosen through `blend` entry ids instead. Ignored in talk mode.
      required:
        - messages
        - projectId
    VenomResponseMode:
      type: string
      enum: [talk, verify, debate]
      description: >-
        How Venom answers — a single assistant (talk), background multi-voice
        verification that converges on one conclusion (verify), or a visible
        multi-voice debate in the thread (debate).
    VenomBlendWeight:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Corner identity — a managed model id when real providers back the
            corner, a persona voice id otherwise.
        weight:
          type: number
          minimum: 0
          maximum: 1
      required: [id, weight]
    VenomVoiceModelPick:
      type: object
      additionalProperties: false
      description: >-
        Assigns one deliberation voice to a specific managed model. Opposing
        voices must run on different LLM providers; the server rejects picks
        that would make a model argue itself.
      properties:
        voiceId:
          type: string
          enum: [direct, skeptic, evidence]
        modelId:
          $ref: "#/components/schemas/VenomModelId"
      required: [voiceId, modelId]
    VenomModelId:
      type: string
      enum: [venom-gpt, venom-claude, venom-gemini, venom-grok]
    VenomChatFileKind:
      type: string
      enum: [upload, generated]
      description: upload = host gave Venom a file; generated = Venom authored it.
    VenomChatFileStatus:
      type: string
      enum: [pending, ready]
    VenomChatFile:
      type: object
      additionalProperties: false
      description: >-
        A file exchanged through chat — uploaded by the host or generated by
        Venom. Extracted text never leaves the server; clients fetch the
        original bytes through the owner-checked download route.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 160
        contentType:
          type: string
          minLength: 1
          maxLength: 100
        size:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 10485760
        kind:
          $ref: "#/components/schemas/VenomChatFileKind"
        status:
          $ref: "#/components/schemas/VenomChatFileStatus"
        textExtracted:
          type: boolean
          description: Whether readable text was extracted for model context.
        createdAt:
          type: number
          multipleOf: 1
          minimum: 0
      required: [id, name, contentType, size, kind, status, textExtracted, createdAt]
    VenomChatFileUploadRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        contentType:
          type: string
          minLength: 1
          maxLength: 100
        size:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 10485760
      required: [name, contentType, size]
    VenomChatFileUploadTicket:
      type: object
      additionalProperties: false
      properties:
        file:
          $ref: "#/components/schemas/VenomChatFile"
        uploadUrl:
          type: string
          maxLength: 8192
        maxBytes:
          type: number
          const: 10485760
      required: [file, uploadUrl, maxBytes]
    VenomMessageAttachment:
      type: object
      additionalProperties: false
      description: >-
        Compact attachment stamp carried on a chat message. The id resolves to
        a VenomChatFile; display metadata is denormalized so history renders
        without a lookup. Attachment stamps ride the synced workspace blob, so
        they must stay tiny.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 160
        contentType:
          type: string
          minLength: 1
          maxLength: 100
        size:
          type: number
          multipleOf: 1
          minimum: 0
          maximum: 10485760
        kind:
          $ref: "#/components/schemas/VenomChatFileKind"
        thumbnail:
          type: string
          minLength: 1
          maxLength: 24000
          pattern: "^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$"
          description: >-
            Tiny inline preview (JPEG/PNG/WEBP data URL) for image
            attachments, generated client-side at attach time. Bounded hard
            because stamps ride the synced workspace blob; full image bytes
            never sync.
      required: [id, name, contentType, size, kind]
    VenomVoiceId:
      type: string
      enum: [direct, skeptic, evidence]
    VenomDeliberationVoice:
      type: object
      additionalProperties: false
      properties:
        voiceId:
          $ref: "#/components/schemas/VenomVoiceId"
        name:
          type: string
          minLength: 1
          maxLength: 80
        tagline:
          type: string
          minLength: 1
          maxLength: 240
      required: [voiceId, name, tagline]
    VenomDeliberationAvailability:
      type: object
      additionalProperties: false
      properties:
        available:
          type: boolean
        distinctModels:
          type: boolean
          description: Whether voices can run on genuinely different models.
        voices:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/VenomDeliberationVoice"
      required: [available, distinctModels, voices]
    VenomManagedModel:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/VenomModelId"
        provider:
          type: string
          enum: [openai, anthropic, gemini, openrouter]
        name:
          type: string
          minLength: 1
          maxLength: 80
        family:
          type: string
          enum: [GPT, Claude, Gemini, Grok]
        summary:
          type: string
          minLength: 1
          maxLength: 240
        available:
          type: boolean
        availabilityText:
          type: string
          minLength: 1
          maxLength: 160
        accountHealth:
          type: string
          enum: [ok, unfunded]
          description: >-
            Account-level health observed on live provider calls. "unfunded"
            means the credential is configured but the account behind it
            cannot pay for replies (billing-class failures), so the model is
            available yet not plainly Ready. Absent means no such evidence.
        costTier:
          $ref: "#/components/schemas/VenomModelCostTier"
      required:
        [id, provider, name, family, summary, available, availabilityText]
    VenomModelCostTier:
      type: string
      enum: ["$", "$$", "$$$"]
      description: >-
        Coarse relative running cost of a managed model, for comparing models
        against each other only. Deliberately never a price, currency amount,
        or provider SKU.
    VenomModelSelectionPolicy:
      type: string
      enum: [manual, auto-cheapest, auto-max-power]
      description: >-
        Account-level model selection policy. "manual" (and absent) keeps the
        user's explicit model picks exactly as before. In the auto modes the
        server chooses the serving models on every request — cheapest healthy
        models for "auto-cheapest", the most capable for "auto-max-power" —
        and keeps that choice current as availability and account health
        change.
    VenomModelPreferences:
      type: object
      additionalProperties: false
      properties:
        enabledModelIds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/VenomModelId"
        defaultModelId:
          $ref: "#/components/schemas/VenomModelId"
        activeModelId:
          $ref: "#/components/schemas/VenomModelId"
        selectionPolicy:
          $ref: "#/components/schemas/VenomModelSelectionPolicy"
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
      required: [enabledModelIds, defaultModelId, activeModelId, updatedAt]
    VenomVoicePresetId:
      type: string
      enum: [sam, marcus, rowan, elijah, maya, isla]
    VenomVoicePreset:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/VenomVoicePresetId"
        name:
          type: string
          minLength: 1
          maxLength: 40
        persona:
          type: string
          minLength: 1
          maxLength: 160
        tone:
          type: string
          enum: [masculine, feminine, neutral]
        sampleText:
          type: string
          minLength: 1
          maxLength: 240
        available:
          type: boolean
        availabilityText:
          type: string
          minLength: 1
          maxLength: 160
      required: [id, name, persona, tone, sampleText, available, availabilityText]
    VenomVoicePreferences:
      type: object
      additionalProperties: false
      properties:
        presetId:
          $ref: "#/components/schemas/VenomVoicePresetId"
        talkativeness:
          $ref: "#/components/schemas/VenomVoiceTalkativeness"
        updatedAt:
          type: number
          multipleOf: 1
          minimum: 0
      required: [presetId, updatedAt]
    VenomVoiceTalkativeness:
      type: string
      description: >-
        How eager voice mode is to answer remarks that don't clearly invite a
        reply. Optional on stored preferences; absent means "balanced".
      enum: [chatty, balanced, reserved]
    VenomVoiceTranscriptionRequest:
      type: object
      additionalProperties: false
      properties:
        audioBase64:
          type: string
          minLength: 1
          maxLength: 5000000
        format:
          type: string
          enum: [webm, wav, mp3, mp4, ogg]
      required: [audioBase64]
    VenomVoiceTranscription:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 8000
      required: [text]
    VenomVoiceSpeechRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        presetId:
          $ref: "#/components/schemas/VenomVoicePresetId"
      required: [text, presetId]
    VenomVoiceTurnDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 8000
        recentTurns:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                maxLength: 4000
            required: [role, content]
        talkativeness:
          $ref: "#/components/schemas/VenomVoiceTalkativeness"
      required: [transcript]
    VenomVoiceTurnDecision:
      type: object
      additionalProperties: false
      properties:
        decisionId:
          type: string
          minLength: 1
          maxLength: 80
          description: Present only once the decision row is durably recorded; when absent, the client executes the decision without reporting an outcome.
        decision:
          type: string
          enum: [respond, acknowledge, silent]
        windDown:
          type: boolean
          description: The exchange reads as a goodbye; the session may ease itself closed after a quiet period.
        acknowledgment:
          type: string
          maxLength: 200
          description: Short spoken acknowledgment; present only when decision is "acknowledge".
      required: [decision, windDown]
    VenomVoiceDecisionOutcomeRequest:
      type: object
      additionalProperties: false
      properties:
        decisionId:
          type: string
          minLength: 1
          maxLength: 80
        outcome:
          type: string
          enum:
            - reply_completed
            - reply_interrupted
            - user_followed_up
            - stayed_quiet
            - wound_down
            - session_closed
      required: [decisionId, outcome]
    VenomVoiceDecisionOutcomeResult:
      type: object
      additionalProperties: false
      properties:
        recorded:
          type: boolean
      required: [recorded]
    VenomVoiceOutcomeRate:
      type: object
      additionalProperties: false
      description: >-
        A proportion together with the sample it was computed from. "settled"
        counts only decisions whose outcome landed in one of the two buckets
        being compared; "hits" is how many landed in the tracked bucket. rate
        is hits/settled, or null when nothing has settled yet — no data is
        never reported as 0%.
      properties:
        settled:
          type: number
          minimum: 0
        hits:
          type: number
          minimum: 0
        rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
      required: [settled, hits, rate]
    VenomVoiceDecisionRateBlock:
      type: object
      additionalProperties: false
      description: >-
        Decision/outcome evidence for one slice of the log. quietRegret reads
        silent non-wind-down decisions (re-ask within the follow-up window vs
        stayed quiet); spokenInterruption reads respond/acknowledge non-wind-
        down decisions (reply interrupted vs completed); windDownClean reads
        wind-down-flagged decisions (session eased closed vs the user
        re-engaging).
      properties:
        decisions:
          type: number
          minimum: 0
        withOutcome:
          type: number
          minimum: 0
        outcomeCoverage:
          type: number
          minimum: 0
          maximum: 1
          description: Share of decisions whose outcome was reported; 0 when the slice is empty.
        decisionCounts:
          type: object
          additionalProperties: false
          properties:
            respond: { type: number, minimum: 0 }
            acknowledge: { type: number, minimum: 0 }
            silent: { type: number, minimum: 0 }
          required: [respond, acknowledge, silent]
        sourceCounts:
          type: object
          additionalProperties: false
          properties:
            heuristic: { type: number, minimum: 0 }
            model: { type: number, minimum: 0 }
            fallback: { type: number, minimum: 0 }
          required: [heuristic, model, fallback]
        windDownFlagged:
          type: number
          minimum: 0
        quietRegret:
          $ref: "#/components/schemas/VenomVoiceOutcomeRate"
        spokenInterruption:
          $ref: "#/components/schemas/VenomVoiceOutcomeRate"
        windDownClean:
          $ref: "#/components/schemas/VenomVoiceOutcomeRate"
      required:
        [
          decisions,
          withOutcome,
          outcomeCoverage,
          decisionCounts,
          sourceCounts,
          windDownFlagged,
          quietRegret,
          spokenInterruption,
          windDownClean,
        ]
    VenomVoiceTalkativenessRates:
      type: object
      additionalProperties: false
      properties:
        talkativeness:
          type: string
          minLength: 1
          maxLength: 32
          description: chatty, balanced, or reserved (unrecognized historical values pass through verbatim).
        rates:
          $ref: "#/components/schemas/VenomVoiceDecisionRateBlock"
      required: [talkativeness, rates]
    VenomVoiceDecisionCell:
      type: object
      additionalProperties: false
      description: >-
        One observed talkativeness x decision x outcome combination and how
        often it occurred. windDown and source ride along so goodbye cells
        and judge-made cells can be read separately; outcome is "pending"
        for decisions still awaiting their outcome report.
      properties:
        talkativeness:
          type: string
          minLength: 1
          maxLength: 32
        decision:
          type: string
          minLength: 1
          maxLength: 32
        windDown:
          type: boolean
        source:
          type: string
          minLength: 1
          maxLength: 32
        outcome:
          type: string
          minLength: 1
          maxLength: 32
        count:
          type: number
          minimum: 1
      required: [talkativeness, decision, windDown, source, outcome, count]
    VenomVoiceRestraintThresholds:
      type: object
      additionalProperties: false
      description: >-
        The heuristic thresholds in force when the summary was generated
        (named constants in venom-voice-restraint.ts and the decision store),
        echoed so aggregate numbers are always read against the rules that
        produced them.
      properties:
        longUtteranceWords: { type: number, minimum: 1 }
        backchannelMaxWords: { type: number, minimum: 1 }
        shortGratitudeMaxWords: { type: number, minimum: 1 }
        botAnswerMaxWords: { type: number, minimum: 1 }
        shortTurnMaxWords: { type: number, minimum: 1 }
        windDownTrailingShortTurns: { type: number, minimum: 0 }
        retentionDays: { type: number, minimum: 1 }
        maxRowsPerUser: { type: number, minimum: 1 }
        transcriptPreviewChars: { type: number, minimum: 1 }
      required:
        [
          longUtteranceWords,
          backchannelMaxWords,
          shortGratitudeMaxWords,
          botAnswerMaxWords,
          shortTurnMaxWords,
          windDownTrailingShortTurns,
          retentionDays,
          maxRowsPerUser,
          transcriptPreviewChars,
        ]
    VenomVoiceDecisionSummary:
      type: object
      additionalProperties: false
      properties:
        windowDays:
          type: number
          minimum: 1
          maximum: 90
        since:
          type: string
          format: date-time
          description: Decisions created at or after this moment were aggregated.
        generatedAt:
          type: string
          format: date-time
        overall:
          $ref: "#/components/schemas/VenomVoiceDecisionRateBlock"
        byTalkativeness:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/VenomVoiceTalkativenessRates"
        cells:
          type: array
          maxItems: 400
          description: Decisions x outcomes x talkativeness counts, deterministic order, observed combinations only.
          items:
            $ref: "#/components/schemas/VenomVoiceDecisionCell"
        thresholds:
          $ref: "#/components/schemas/VenomVoiceRestraintThresholds"
      required:
        [
          windowDays,
          since,
          generatedAt,
          overall,
          byTalkativeness,
          cells,
          thresholds,
        ]
    VenomUsageSummary:
      type: object
      additionalProperties: false
      required: [periodStart, periodEnd, totals, hasEstimates, daily, models]
      properties:
        periodStart:
          type: string
          format: date
          description: First day of the summarized period (UTC), inclusive.
        periodEnd:
          type: string
          format: date
          description: End day of the summarized period (UTC), exclusive.
        totals:
          $ref: "#/components/schemas/VenomUsageTotals"
        hasEstimates:
          type: boolean
          description: >-
            True when any entry in the period is a flagged estimate rather
            than provider-reported usage (interrupted streams, providers
            that omit usage metadata, and voice audio legs).
        daily:
          type: array
          maxItems: 31
          description: Per-day spend, oldest first; days without usage are omitted.
          items:
            $ref: "#/components/schemas/VenomUsageDay"
        models:
          type: array
          maxItems: 40
          description: Per-model breakdown under Venom-branded names, highest spend first.
          items:
            $ref: "#/components/schemas/VenomUsageModelBreakdown"
    VenomUsageTotals:
      type: object
      additionalProperties: false
      required: [costUsd, requests, promptTokens, outputTokens]
      properties:
        costUsd:
          type: number
          minimum: 0
          description: Dollars, rounded to micro-dollar precision.
        requests:
          type: number
          minimum: 0
        promptTokens:
          type: number
          minimum: 0
        outputTokens:
          type: number
          minimum: 0
    VenomUsageDay:
      type: object
      additionalProperties: false
      required: [date, costUsd, requests]
      properties:
        date:
          type: string
          format: date
        costUsd:
          type: number
          minimum: 0
        requests:
          type: number
          minimum: 0
    VenomUsageModelBreakdown:
      type: object
      additionalProperties: false
      required:
        [
          modelId,
          modelName,
          costUsd,
          requests,
          promptTokens,
          outputTokens,
          hasEstimates,
        ]
      properties:
        modelId:
          type: string
          maxLength: 80
          description: Venom-branded model alias — never a provider SKU.
        modelName:
          type: string
          maxLength: 120
        costUsd:
          type: number
          minimum: 0
        requests:
          type: number
          minimum: 0
        promptTokens:
          type: number
          minimum: 0
        outputTokens:
          type: number
          minimum: 0
        hasEstimates:
          type: boolean
    KnowledgeConversation:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        title:
          type: string
          minLength: 1
          maxLength: 160
        projectId:
          type: [string, "null"]
          maxLength: 160
    KnowledgeMessage:
      type: object
      additionalProperties: false
      required: [id, role, content]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 8000
    KnowledgeExtractionInput:
      type: object
      additionalProperties: false
      required: [conversation, messages]
      properties:
        conversation:
          $ref: "#/components/schemas/KnowledgeConversation"
        messages:
          type: array
          minItems: 1
          maxItems: 48
          items:
            $ref: "#/components/schemas/KnowledgeMessage"
        file:
          type: boolean
          description: >-
            When true, the server files the extracted insights into the
            signed-in user's ontology store and returns the touched concepts
            in `filed`. The server decides scope per cluster (personal,
            a workspace the caller belongs to, or the private Unsorted
            holding area); clients no longer pick a destination. Clients
            that omit this keep filing locally.
    KnowledgeCandidate:
      type: object
      additionalProperties: false
      required:
        [label, category, confidence, summary, sourceMessageIds, relatedLabels]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
        category:
          type: string
          minLength: 1
          maxLength: 32
        confidence:
          type: number
          minimum: 0
          maximum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 240
        sourceMessageIds:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 160
        relatedLabels:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 64
    KnowledgeExtraction:
      type: object
      additionalProperties: false
      required: [clusters]
      properties:
        clusters:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/KnowledgeCandidate"
        filed:
          type: array
          maxItems: 80
          description: >-
            Present only when the request set `file: true` and the insights
            were filed server-side. Contains every concept the filing
            created, strengthened, or re-linked, with canonical ids.
          items:
            $ref: "#/components/schemas/VenomKnowledgeCluster"
        filedScope:
          $ref: "#/components/schemas/VenomFiledScope"
        workspaceFilings:
          type: array
          maxItems: 8
          description: >-
            Workspaces the extraction auto-filed clusters into, one entry
            per workspace, each carrying the ledger row id that lets the
            author undo the filing. The clusters themselves are not
            returned: workspace records never merge into personal state.
          items:
            $ref: "#/components/schemas/VenomWorkspaceFiling"
    VenomWorkspaceFiling:
      type: object
      additionalProperties: false
      required: [noticeId, workspaceId, workspaceName, labels]
      properties:
        noticeId:
          type: string
          minLength: 1
          maxLength: 64
        workspaceId:
          $ref: "#/components/schemas/Uuid"
        workspaceName:
          type: string
          minLength: 1
          maxLength: 120
        labels:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 64
    VenomKnowledgeMoves:
      type: object
      additionalProperties: false
      required: [notices, suggestions]
      properties:
        notices:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/VenomKnowledgeMoveNotice"
        suggestions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/VenomKnowledgeSuggestion"
    VenomKnowledgeMoveNotice:
      type: object
      additionalProperties: false
      description: >-
        One automatic filing decision, kept author-private. `auto_file`
        rows come from extraction filing straight into a workspace;
        `refile` rows come from the re-filing pass, with `direction`
        telling which way the concept moved.
      required: [id, kind, status, labels, createdAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum: [auto_file, refile]
        status:
          type: string
          enum: [active, undone]
        direction:
          type: string
          enum: [unsorted_to_workspace, workspace_to_personal]
        workspaceId:
          type: [string, "null"]
          maxLength: 64
        workspaceName:
          type: [string, "null"]
          maxLength: 120
        labels:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 64
        createdAt:
          type: number
          multipleOf: 1
          minimum: 0
    VenomKnowledgeSuggestion:
      type: object
      additionalProperties: false
      description: >-
        A pending personal-to-workspace sharing suggestion. Nothing moves
        until the author accepts; accepting widens visibility to the
        workspace's members.
      required: [id, workspaceId, workspaceName, conceptId, label, createdAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        workspaceId:
          $ref: "#/components/schemas/Uuid"
        workspaceName:
          type: string
          minLength: 1
          maxLength: 120
        conceptId:
          type: string
          minLength: 1
          maxLength: 120
        label:
          type: string
          minLength: 1
          maxLength: 200
        createdAt:
          type: number
          multipleOf: 1
          minimum: 0
    VenomKnowledgeMoveUndo:
      type: object
      additionalProperties: false
      required: [restored]
      properties:
        restored:
          type: array
          maxItems: 80
          description: >-
            Personal-store records the undo created or restored (for
            auto-file undos these carry `unsorted: true`). Empty when the
            undo only touched workspace stores.
          items:
            $ref: "#/components/schemas/VenomKnowledgeCluster"
    VenomKnowledgeMoveResult:
      type: object
      additionalProperties: false
      required: [workspaceId, workspaceName, conceptId, movedConceptId, merged]
      properties:
        workspaceId:
          $ref: "#/components/schemas/Uuid"
        workspaceName:
          type: string
          minLength: 1
          maxLength: 120
        conceptId:
          type: string
          minLength: 1
          maxLength: 120
        movedConceptId:
          type: string
          minLength: 1
          maxLength: 120
        merged:
          type: boolean
    VenomKnowledgeSuggestionDismissal:
      type: object
      additionalProperties: false
      required: [dismissed]
      properties:
        dismissed:
          type: boolean
    VenomUnsortedMoveInput:
      type: object
      additionalProperties: false
      required: [workspaceId]
      properties:
        workspaceId:
          $ref: "#/components/schemas/Uuid"
    VenomFiledScope:
      type: object
      additionalProperties: false
      description: >-
        Where server-side filing landed. Conversations in company-shared
        projects file into that company's Brain; everything else stays in
        the personal ontology. When ownerType is "org" the concepts in
        `filed` belong to the company layer and must not be merged into the
        caller's personal clusters.
      required: [ownerType]
      properties:
        ownerType:
          type: string
          enum: [user, org]
        orgId:
          type: string
          minLength: 1
          maxLength: 64
        orgName:
          type: string
          minLength: 1
          maxLength: 80
    VenomMasterContribution:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    UpdateVenomMasterContributionInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    VenomMasterConcept:
      type: object
      additionalProperties: false
      description: >-
        An aggregate concept in the anonymous master ontology. Carries a
        label, a category, and a normalized prevalence weight only; it
        exists only once the concept was seen across the minimum number of
        distinct accounts or companies, and never carries names, excerpts,
        or per-contributor traces.
      required: [id, label, category, strength, x, y]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        label:
          type: string
          minLength: 1
          maxLength: 64
        category:
          type: string
          minLength: 1
          maxLength: 32
        strength:
          type: number
          minimum: 0
          maximum: 1
        x:
          type: number
        y:
          type: number
    VenomMasterLink:
      type: object
      additionalProperties: false
      required: [a, b, strength]
      properties:
        a:
          type: string
          minLength: 1
          maxLength: 160
        b:
          type: string
          minLength: 1
          maxLength: 160
        strength:
          type: number
          minimum: 0
          maximum: 1
    VenomMasterBrain:
      type: object
      additionalProperties: false
      required: [concepts, links]
      properties:
        concepts:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/VenomMasterConcept"
        links:
          type: array
          maxItems: 900
          items:
            $ref: "#/components/schemas/VenomMasterLink"
    VenomMasterSuggestion:
      type: object
      additionalProperties: false
      required: [label, category, strength, relatedToLabels]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
        category:
          type: string
          minLength: 1
          maxLength: 32
        strength:
          type: number
          minimum: 0
          maximum: 1
        relatedToLabels:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 200
    VenomMasterSuggestionList:
      type: object
      additionalProperties: false
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/VenomMasterSuggestion"
    DismissVenomMasterSuggestionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
    VenomMasterSuggestionDismissal:
      type: object
      additionalProperties: false
      required: [dismissed]
      properties:
        dismissed:
          type: boolean
    ApplyVenomMasterSuggestionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
        orgId:
          type: string
          minLength: 1
          maxLength: 64
    VenomMasterSuggestionApplied:
      type: object
      additionalProperties: false
      required: [filedScope]
      properties:
        filedScope:
          $ref: "#/components/schemas/VenomFiledScope"
        filed:
          type: array
          maxItems: 80
          description: >-
            Present for personal filings only. Company concepts stay in the
            company layer and are never mirrored into personal clusters.
          items:
            $ref: "#/components/schemas/VenomKnowledgeCluster"
    VenomOntologySearchResult:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          label,
          category,
          summary,
          strength,
          mentionCount,
          lastUpdatedAt,
          evidenceCount,
        ]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
        projectId:
          type: string
          maxLength: 120
          nullable: true
        label:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        summary:
          type: string
          maxLength: 2000
        strength:
          type: number
          minimum: 0
          maximum: 1
        mentionCount:
          type: number
          minimum: 0
        lastUpdatedAt:
          type: number
          minimum: 0
        evidenceCount:
          type: number
          minimum: 0
    VenomOntologySearchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/VenomOntologySearchResult"
    VenomOntologyConceptDetail:
      type: object
      additionalProperties: false
      required: [concept, neighbors, people]
      properties:
        concept:
          $ref: "#/components/schemas/VenomKnowledgeCluster"
        neighbors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VenomOntologySearchResult"
        people:
          description: >-
            Identity labels for every person attributed to this concept's
            evidence. Evidence captured before attribution is reported under
            the ontology owner's identity, so every evidence entry's
            capturedByUserId resolves against this list.
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/VenomOntologyPerson"
    VenomOntologyPerson:
      type: object
      additionalProperties: false
      required: [userId, displayName]
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 120
        displayName:
          description: >-
            Best display label for the person (their name, else their
            email). Null when the identity record has neither.
          type: [string, "null"]
          maxLength: 320
    VenomIdentity:
