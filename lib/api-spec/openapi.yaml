      parameters:
        - $ref: "#/components/parameters/VenomOrgId"
      responses:
        "200":
          description: Members and pending invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenomOrgMemberDirectory"
        "401":
          description: Authentication required
        "403":
          description: Caller is not a member of this company
        "404":
          description: Company not found
  /venom/orgs/{orgId}/members/{memberUserId}:
    delete:
      operationId: removeVenomOrgMember
