name: Venom Kanban E2E

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Venom changes
    runs-on: ubuntu-latest
    outputs:
      venom: ${{ steps.filter.outputs.changed }}
    steps:
      # A checkout must come first so the local composite action below can be
      # resolved from the workspace; the action re-checks-out at the depth the
      # event actually needs.
      - uses: actions/checkout@v4

      # Owns the event-conditional fetch depth and the merge_group base/head
      # wiring; this workflow only supplies its filter list.
      - id: filter
        uses: ./.github/actions/detect-changes
        with:
          name: venom
          filters: |
            venom:
              - "artifacts/venom/**"
              - "lib/api-client-react/**"
              - "lib/api-spec/**"
              - "lib/knowledge-text/**"
              - "lib/slime/**"
              - "lib/venom-workspace-merge/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"
              - ".github/workflows/venom-kanban-e2e.yml"
              - ".github/actions/detect-changes/**"

  kanban-regression:
    name: Kanban browser regression
    needs: changes
    if: needs.changes.outputs.venom == 'true'
    runs-on: ubuntu-latest
    # Sized for the full spec list at BOTH viewport sizes (mobile-chromium +
    # desktop-chromium in one Playwright run). Measured on these runners:
    # the phone-size pass alone took 10-15 minutes (it was overrunning the
    # old fixed 15-minute budget, which could not move while no credential
    # could write workflow files), so two CPU-bound passes plus ~3-4 minutes
    # of setup and retry headroom lands around 30-35; 45 leaves margin for
    # runner variance. If this trips, the list reporter names the slow
    # tests — read that before reaching for a bigger number.
    timeout-minutes: 45
    env:
      CI: "true"
      VENOM_E2E_BASE_URL: http://127.0.0.1:22167
      EXPO_PUBLIC_VENOM_UI_TEST: "true"
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      EXPO_PACKAGER_PROXY_URL: http://127.0.0.1:22167
      EXPO_PUBLIC_DOMAIN: 127.0.0.1:22167
      REACT_NATIVE_PACKAGER_HOSTNAME: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify CI configuration
        run: |
          if [ -z "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the CLERK_PUBLISHABLE_KEY GitHub Actions secret before running Venom E2E."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package's pure-logic suite (node --test, a couple of seconds). It
      # needs no browser or Expo server, so it runs before the expensive E2E
      # setup: a broken reducer or merge rule fails this required check fast.
      - name: Run Venom unit tests
        run: pnpm --filter @workspace/venom run test:unit

      - name: Install Playwright Chromium dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Expo web
        run: |
          set -euo pipefail

          pnpm --filter @workspace/venom exec expo start --web --localhost --port 22167 \
            > "$RUNNER_TEMP/venom-expo.log" 2>&1 &
          expo_pid=$!
          echo "VENOM_EXPO_PID=$expo_pid" >> "$GITHUB_ENV"

          for attempt in $(seq 1 90); do
            if curl --fail --silent --output /dev/null "$VENOM_E2E_BASE_URL"; then
              exit 0
            fi

            if ! kill -0 "$expo_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/venom-expo.log"
              exit 1
            fi

            sleep 2
          done

          echo "::error::Expo web did not become ready in time."
          cat "$RUNNER_TEMP/venom-expo.log"
          exit 1

      - name: Run Venom E2E
        run: pnpm test:e2e:venom

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: venom-kanban-playwright-failures
          path: |
            artifacts/venom/test-results/
            artifacts/venom/playwright-report/
            ${{ runner.temp }}/venom-expo.log
          if-no-files-found: ignore
          retention-days: 14
